name: Publish alpha.34

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-alpha34.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.0-alpha.34
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Final release gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q
          python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
          grep -F 'VERSION = "0.2.0-alpha.34"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.2.0-alpha.34"' custom_components/dummy_os_data/manifest.json
          test -f RELEASE_NOTES_0.2.0-alpha.34.md
          test -f tests/test_alpha34_sequential_safety.py
          test -f tests/test_alpha33_reserve_safety_hourly_fix.py
          test -f tests/test_alpha32_native_planner_parity.py
          test -f tests/test_alpha31_resilient_planner.py
          test -f tests/test_alpha30_startup_performance.py
          test -f tests/test_alpha29_price_buffer.py
          python -m pytest -q tests/test_alpha34_sequential_safety.py tests/test_alpha33_reserve_safety_hourly_fix.py tests/test_alpha32_native_planner_parity.py tests/test_alpha31_resilient_planner.py tests/test_alpha30_startup_performance.py tests/test_alpha29_price_buffer.py tests/test_do_plan_input.py tests/test_do_plan_energy_need.py tests/test_do_plan_reserve_soc.py tests/test_do_plan_grid_support.py tests/test_do_plan_preview.py tests/test_do_plan_72h.py
      - name: Build install assets
        run: |
          mkdir -p dist
          cd custom_components
          zip -qr ../dist/Dummy_OS_Energy_0.2.0-alpha.34_HA_install.zip dummy_os_data -x '*/__pycache__/*' '*.pyc'
          cd ..
          sha256sum dist/Dummy_OS_Energy_0.2.0-alpha.34_HA_install.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.34.txt
      - name: Check packaged sources
        run: |
          python - <<'PYCODE'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('dist/Dummy_OS_Energy_0.2.0-alpha.34_HA_install.zip') as archive:
              names = archive.namelist()
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
              assert json.loads(archive.read('dummy_os_data/manifest.json'))['version'] == '0.2.0-alpha.34'
              for source in Path('custom_components/dummy_os_data').rglob('*.py'):
                  key = str(source.relative_to('custom_components'))
                  assert archive.read(key) == source.read_bytes(), key
          PYCODE
      - name: Publish prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Dummy OS Energy $VERSION - Sequential Safety Repair"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            dist/Dummy_OS_Energy_0.2.0-alpha.34_HA_install.zip \
            dist/SHA256SUMS-0.2.0-alpha.34.txt \
            --title "Dummy OS Energy 0.2.0-alpha.34 - Sequential Safety Repair" \
            --notes-file RELEASE_NOTES_0.2.0-alpha.34.md \
            --prerelease \
            --verify-tag
