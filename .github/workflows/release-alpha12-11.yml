name: Release Dummy OS Forecast alpha.12.11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha12-11.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - run: python -m compileall -q custom_components/dummy_os_data
      - name: Run release contract tests
        run: python -m pytest -q tests/test_energy_hour_quality.py tests/test_energy_hour_sensor_contract.py tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Verify release metadata
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.11"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.11"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.11`' RELEASE_NOTES.md
      - name: Build Home Assistant install ZIP
        run: |
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.11_HA_install.zip custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.11_HA_install.zip > SHA256SUMS-alpha12.11.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.1.0-alpha.12.11 \
            Dummy_OS_Forecast_0.1.0-alpha.12.11_HA_install.zip \
            SHA256SUMS-alpha12.11.txt \
            --target "$GITHUB_SHA" \
            --title 'Dummy OS Forecast 0.1.0-alpha.12.11 - Energy Hourly Quality Diagnostic' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
