name: Release Dummy OS Forecast alpha.12.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha12-7.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data

      - name: Run release contract tests
        run: python -m pytest -q tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py

      - name: Verify release metadata
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.7"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.7"' custom_components/dummy_os_data/manifest.json
          grep -F '**Tag:** `0.1.0-alpha.12.7`' RELEASE_NOTES.md

      - name: Build Home Assistant install ZIP
        run: |
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.7_HA_install.zip custom_components/dummy_os_data \
            -x '*/__pycache__/*' '*.pyc'
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.7_HA_install.zip > SHA256SUMS-alpha12.7.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.1.0-alpha.12.7 \
            Dummy_OS_Forecast_0.1.0-alpha.12.7_HA_install.zip \
            SHA256SUMS-alpha12.7.txt \
            --target "$GITHUB_SHA" \
            --title 'Dummy OS Forecast 0.1.0-alpha.12.7 - Energy Persistent Store Foundation' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
