name: Alpha35 source check
on:
  push:
    branches: [alpha35-shared-time-contract]
    paths: [.github/workflows/alpha35-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source tree
        run: |
          mkdir -p /tmp/alpha35-export
          git archive HEAD | gzip > /tmp/alpha35-export/source.tar.gz
          git rev-parse HEAD > /tmp/alpha35-export/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha35-source-baseline
          path: /tmp/alpha35-export/*
          retention-days: 2
