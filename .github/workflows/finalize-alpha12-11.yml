name: Finalize Dummy OS Forecast alpha.12.11

on:
  push:
    branches:
      - release-alpha12-11
    paths:
      - .github/workflows/finalize-alpha12-11.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha12-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Update release consistency version
        run: sed -i 's/VERSION = "0.1.0-alpha.12.10"/VERSION = "0.1.0-alpha.12.11"/' tests/test_release_consistency.py
      - run: python -m compileall -q custom_components/dummy_os_data
      - name: Run release contract tests
        run: python -m pytest -q tests/test_energy_hour_quality.py tests/test_energy_hour_sensor_contract.py tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Commit finalized release metadata
        run: |
          rm .github/workflows/finalize-alpha12-11.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_release_consistency.py .github/workflows/finalize-alpha12-11.yml
          git commit -m 'Finalize 0.1.0-alpha.12.11 release metadata'
          git push origin HEAD:release-alpha12-11
