name: Publish Dummy OS Forecast alpha.12.17

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha12-17.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VERSION: 0.1.0-alpha.12.17
      ZIP_NAME: Dummy_OS_Forecast_0.1.0-alpha.12.17_HA_install.zip
      CHECKSUM_NAME: SHA256SUMS-alpha12.17.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data tests
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify release and observer boundary
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.17"' custom_components/dummy_os_data/const.py
          grep -F '"version": "0.1.0-alpha.12.17"' custom_components/dummy_os_data/manifest.json
          grep -F 'RECENCY_HALF_LIFE_DAYS = 28.0' custom_components/dummy_os_data/forecast.py
          grep -F 'SCHEMA_VERSION = "8a.1"' custom_components/dummy_os_data/recency_weighting.py
          grep -F 'ALGORITHM_VERSION = "recency_weighting_observer_v1"' custom_components/dummy_os_data/recency_weighting.py
          grep -F '"forecast_influence_enabled": False' custom_components/dummy_os_data/recency_weighting.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
          grep -F 'QUARTER_MINUTES = 15' custom_components/dummy_os_data/const.py
      - name: Verify complete identity gate
        run: |
          grep -F '_attr_unique_id = "do_energy_recency_weighting"' custom_components/dummy_os_data/sensor.py
          grep -F '_attr_suggested_object_id = "do_energy_recency_weighting"' custom_components/dummy_os_data/sensor.py
          grep -F 'return "DO Energy Recency Weighting"' custom_components/dummy_os_data/sensor.py
          grep -F '("sensor", "do_energy_recency_weighting", "sensor.do_energy_recency_weighting")' custom_components/dummy_os_data/__init__.py
          grep -F '"do_energy_recency_weighting": "sensor.dummy_os_forecast_do_energy_recency_weighting"' custom_components/dummy_os_data/entity_migrations.py
          ! grep -R -F 'sensor.do_energy_recency_weighting_2' custom_components/dummy_os_data
      - name: Build Home Assistant install ZIP
        run: |
          rm -f "$ZIP_NAME" "$CHECKSUM_NAME"
          zip -r "$ZIP_NAME" custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP_NAME" > "$CHECKSUM_NAME"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "$ZIP_NAME" "$CHECKSUM_NAME" \
            --target "$GITHUB_SHA" \
            --title 'Dummy OS Forecast 0.1.0-alpha.12.17 - Energy Recency Weighting Observer' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
