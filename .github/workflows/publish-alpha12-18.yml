name: Publish Dummy OS Forecast alpha.12.18

on:
  push:
    branches:
      - release-alpha12-18-publish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.0-alpha.12.18
      TARGET_SHA: 3d82775d230e2d2b466b49cdc5c9fe9dfd7adeb7
      ASSET: Dummy_OS_Forecast_0.1.0-alpha.12.18_HA_install.zip
      CHECKSUM: SHA256SUMS-alpha12.18.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Validate exact release source
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -q 'VERSION = "0.1.0-alpha.12.18"' custom_components/dummy_os_data/const.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/dummy_os_data/manifest.json').read_text())
          assert manifest['version']=='0.1.0-alpha.12.18'
          PY
          python -m compileall -q custom_components/dummy_os_data
          python -m pytest -q
      - name: Build Home Assistant installation ZIP
        run: |
          find custom_components/dummy_os_data -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -qr "$ASSET" custom_components/dummy_os_data
          sha256sum "$ASSET" | tee "$CHECKSUM"
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "Dummy OS Forecast 0.1.0-alpha.12.18 - Stable Foundation Reset" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            "$ASSET" "$CHECKSUM"
      - uses: actions/upload-artifact@v4
        with:
          name: dummy-os-forecast-alpha12-18-install
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
