name: Validate Home Forecast Data source switch

on:
  push:
    branches:
      - fix/home-forecast-use-data-home-power
    paths:
      - custom_components/dummy_os_data/**
      - tests/**
      - .github/workflows/validate-home-forecast-data-source.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m compileall custom_components/dummy_os_data tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('custom_components/dummy_os_data/manifest.json'), Path('custom_components/dummy_os_data/strings.json'), Path('custom_components/dummy_os_data/translations/en.json'), Path('custom_components/dummy_os_data/translations/nl.json')]:
              json.loads(path.read_text())
          PY
