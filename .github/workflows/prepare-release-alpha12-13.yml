name: Prepare Dummy OS Forecast alpha.12.13

on:
  push:
    branches:
      - fix-peak-learning-identity
    paths:
      - .github/workflows/prepare-release-alpha12-13.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-peak-learning-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted identity correction
        run: python scripts/prepare_alpha12_13.py
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Commit prepared fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/__init__.py custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_peak_learning.py tests/test_release_consistency.py RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize alpha.12.13 Peak Learning identity fix'
          git push origin HEAD:fix-peak-learning-identity
