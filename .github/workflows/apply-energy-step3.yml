name: Apply Energy Step 3 daypart quality

on:
  push:
    branches:
      - energy-step3-daypart-quality
    paths:
      - .github/workflows/apply-energy-step3.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: energy-step3-daypart-quality

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Patch evaluation daypart diagnostics
        run: |
          cat >> custom_components/dummy_os_data/evaluation.py <<'PY'

          DAYPART_MINIMUM_SAMPLES = 32
          DAYPARTS: tuple[tuple[str, int, int], ...] = (
              ("night", 0, 6),
              ("morning", 6, 12),
              ("afternoon", 12, 18),
              ("evening", 18, 24),
          )


          def _parse_aware_start(value: Any):
              """Parse an ISO timestamp and require timezone information."""
              from datetime import datetime

              if not isinstance(value, str):
                  return None
              try:
                  parsed = datetime.fromisoformat(value)
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  return None
              return parsed


          def _daypart_for_local_start(local_start) -> str:
              """Return the fixed Step 3 daypart for a local quarter start."""
              hour = local_start.hour
              if hour < 6:
                  return "night"
              if hour < 12:
                  return "morning"
              if hour < 18:
                  return "afternoon"
              return "evening"


          def calculate_daypart_quality(
              evaluations: list[dict[str, Any]],
              records: list[dict[str, Any]],
              profile: str,
              localize,
          ) -> dict[str, Any]:
              """Calculate observer-only forecast quality per fixed local daypart.

              Evaluation coverage is the number of usable forward-looking
              evaluations divided by valid actual quarters for the same profile
              and daypart. Invalid/missing values are never reconstructed as zero.
              """
              valid_actual_counts = {name: 0 for name, _, _ in DAYPARTS}
              selected = {name: [] for name, _, _ in DAYPARTS}

              for record in records:
                  if record.get("profile") != profile or record.get("valid") is not True:
                      continue
                  start = _parse_aware_start(record.get("start"))
                  if start is None:
                      continue
                  daypart = _daypart_for_local_start(localize(start))
                  valid_actual_counts[daypart] += 1

              for item in evaluations:
                  if item.get("profile") != profile:
                      continue
                  start = _parse_aware_start(item.get("start"))
                  if start is None:
                      continue
                  try:
                      float(item["actual_kwh"])
                      float(item["forecast_kwh"])
                  except (KeyError, TypeError, ValueError):
                      continue
                  daypart = _daypart_for_local_start(localize(start))
                  selected[daypart].append(item)

              result: dict[str, Any] = {}
              all_sufficient = True
              for name, start_hour, end_hour in DAYPARTS:
                  metrics = calculate_metrics(selected[name], profile=None)
                  samples = int(metrics["samples"])
                  denominator = valid_actual_counts[name]
                  coverage = None
                  if denominator > 0:
                      coverage = round(min(100.0, samples / denominator * 100.0), 1)
                  status = "sufficient_basis" if samples >= DAYPART_MINIMUM_SAMPLES else "collecting"
                  if status != "sufficient_basis":
                      all_sufficient = False
                  result[name] = {
                      "start_local": f"{start_hour:02d}:00",
                      "end_local": f"{end_hour:02d}:00",
                      "status": status,
                      "sample_count": samples,
                      "mae_kwh": metrics["mae_kwh"],
                      "bias_kwh": metrics["bias_kwh"],
                      "evaluation_coverage_percent": coverage,
                      "accuracy_percent": metrics["accuracy_percent"],
                      "valid_actual_quarters": denominator,
                  }

              return {
                  "profile": profile,
                  "status": "sufficient_basis" if all_sufficient else "collecting",
                  "minimum_samples_for_sufficient_basis": DAYPART_MINIMUM_SAMPLES,
                  "observer_only": True,
                  "dayparts": result,
              }
          PY

      - name: Patch sensor contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/dummy_os_data/sensor.py')
          text = path.read_text()
          text = text.replace(
              'from .degree_days_sensor import build_degree_days_sensors\n',
              'from .degree_days_sensor import build_degree_days_sensors\nfrom .evaluation import calculate_daypart_quality\n',
          )
          text = text.replace(
              '            DummyOSHomeForecastEvaluationSamplesSensor(coordinator),\n',
              '            DummyOSHomeForecastEvaluationSamplesSensor(coordinator),\n            DummyOSHomeForecastQualityByDaypartSensor(coordinator),\n',
          )
          marker = '\n\nclass DummyOSWeatherCurrentSensor'
          if marker not in text:
              raise SystemExit('weather sensor insertion marker missing')
          block = '''\n\nclass DummyOSHomeForecastQualityByDaypartSensor(DummyOSBaseSensor):\n    \"\"\"Observer-only Energy forecast quality split by fixed local dayparts.\"\"\"\n\n    _attr_name = \"DO Energy Forecast Quality By Daypart\"\n    _attr_unique_id = \"do_energy_forecast_quality_by_daypart\"\n    _attr_suggested_object_id = \"do_energy_forecast_quality_by_daypart\"\n    _attr_icon = \"mdi:chart-timeline-variant\"\n\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_daypart_quality(\n            self.coordinator.evaluations,\n            self.coordinator.records,\n            self.coordinator.profile,\n            dt_util.as_local,\n        )\n\n    @property\n    def native_value(self) -> str:\n        return str(self._quality[\"status\"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        quality = self._quality\n        return {\n            \"profile\": quality[\"profile\"],\n            \"observer_only\": True,\n            \"resolution_minutes\": 15,\n            \"minimum_samples_for_sufficient_basis\": quality[\"minimum_samples_for_sufficient_basis\"],\n            \"daypart_basis\": \"local_quarter_start\",\n            \"dayparts\": quality[\"dayparts\"],\n        }\n'''
          text = text.replace(marker, block + marker)
          path.write_text(text)
          PY

      - name: Patch deterministic entity identity
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations = Path('custom_components/dummy_os_data/entity_migrations.py')
          text = migrations.read_text()
          insert = '''\nENERGY_GENERATED_ENTITY_ID_ALIASES: dict[str, str] = {\n    \"do_energy_forecast_quality_by_daypart\": \"sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart\",\n}\n\n'''
          marker = 'OBSOLETE_HOME_INPUT_ENTITY_ALIASES: dict[str, set[str]] = {'
          if 'ENERGY_GENERATED_ENTITY_ID_ALIASES' not in text:
              text = text.replace(marker, insert + marker)
          text = text.replace(
              '    if entity_id == DEGREE_DAYS_GENERATED_ENTITY_ID_ALIASES.get(unique_id):\n        return True\n',
              '    if entity_id == DEGREE_DAYS_GENERATED_ENTITY_ID_ALIASES.get(unique_id):\n        return True\n    if entity_id == ENERGY_GENERATED_ENTITY_ID_ALIASES.get(unique_id):\n        return True\n',
          )
          migrations.write_text(text)

          init = Path('custom_components/dummy_os_data/__init__.py')
          text = init.read_text()
          anchor = '    ("sensor", "do_degree_days_status", "sensor.do_degree_days_status"),\n'
          addition = '    ("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart"),\n'
          if addition not in text:
              text = text.replace(anchor, addition + anchor)
          init.write_text(text)
          PY

      - name: Add Step 3 tests
        run: |
          cat > tests/test_energy_daypart_quality.py <<'PY'
          from __future__ import annotations

          import importlib.util
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path(__file__).resolve().parents[1]
          MODULE_PATH = ROOT / "custom_components/dummy_os_data/evaluation.py"
          SPEC = importlib.util.spec_from_file_location("energy_evaluation", MODULE_PATH)
          assert SPEC is not None and SPEC.loader is not None
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)

          calculate_daypart_quality = MODULE.calculate_daypart_quality


          def _iso(local_text: str) -> str:
              local = datetime.fromisoformat(local_text).replace(tzinfo=ZoneInfo("Europe/Amsterdam"))
              return local.astimezone(timezone.utc).isoformat()


          def _record(local_text: str, profile: str = "normal", valid: bool = True):
              return {"start": _iso(local_text), "profile": profile, "valid": valid}


          def _evaluation(local_text: str, actual: float = 1.0, forecast: float = 1.1, profile: str = "normal"):
              return {"start": _iso(local_text), "profile": profile, "actual_kwh": actual, "forecast_kwh": forecast}


          def _localize(value):
              return value.astimezone(ZoneInfo("Europe/Amsterdam"))


          def test_fixed_boundaries_assign_exact_quarters_to_expected_dayparts():
              times = ["2026-09-05T00:00", "2026-09-05T05:45", "2026-09-05T06:00", "2026-09-05T11:45", "2026-09-05T12:00", "2026-09-05T17:45", "2026-09-05T18:00", "2026-09-05T23:45"]
              records = [_record(t) for t in times]
              evaluations = [_evaluation(t) for t in times]
              result = calculate_daypart_quality(evaluations, records, "normal", _localize)
              for name in ("night", "morning", "afternoon", "evening"):
                  assert result["dayparts"][name]["sample_count"] == 2
                  assert result["dayparts"][name]["valid_actual_quarters"] == 2
                  assert result["dayparts"][name]["evaluation_coverage_percent"] == 100.0


          def test_profile_is_strict_and_invalid_actuals_do_not_enter_coverage_denominator():
              records = [
                  _record("2026-09-05T06:00", "normal", True),
                  _record("2026-09-05T06:15", "normal", False),
                  _record("2026-09-05T06:30", "away", True),
              ]
              evaluations = [
                  _evaluation("2026-09-05T06:00", profile="normal"),
                  _evaluation("2026-09-05T06:30", profile="away"),
              ]
              result = calculate_daypart_quality(evaluations, records, "normal", _localize)
              morning = result["dayparts"]["morning"]
              assert morning["sample_count"] == 1
              assert morning["valid_actual_quarters"] == 1
              assert morning["evaluation_coverage_percent"] == 100.0


          def test_missing_evaluation_values_are_skipped_not_zeroed():
              records = [_record("2026-09-05T12:00"), _record("2026-09-05T12:15")]
              evaluations = [
                  _evaluation("2026-09-05T12:00", actual=1.0, forecast=1.2),
                  {"start": _iso("2026-09-05T12:15"), "profile": "normal", "actual_kwh": None, "forecast_kwh": 0.0},
              ]
              result = calculate_daypart_quality(evaluations, records, "normal", _localize)
              afternoon = result["dayparts"]["afternoon"]
              assert afternoon["sample_count"] == 1
              assert afternoon["mae_kwh"] == 0.2
              assert afternoon["bias_kwh"] == 0.2
              assert afternoon["evaluation_coverage_percent"] == 50.0


          def test_readiness_requires_32_samples_per_daypart():
              records = []
              evaluations = []
              for hour in (0, 6, 12, 18):
                  for index in range(32):
                      day = 1 + index // 4
                      minute = (index % 4) * 15
                      local_text = f"2026-09-{day:02d}T{hour:02d}:{minute:02d}"
                      records.append(_record(local_text))
                      evaluations.append(_evaluation(local_text))
              result = calculate_daypart_quality(evaluations, records, "normal", _localize)
              assert result["status"] == "sufficient_basis"
              assert all(item["status"] == "sufficient_basis" for item in result["dayparts"].values())


          def test_dst_conversion_uses_local_quarter_start():
              # 2026-10-25 is the Europe/Amsterdam DST fallback day. Both UTC instants
              # map to a local 02:15 quarter and therefore remain in the night segment.
              records = [
                  {"start": "2026-10-25T00:15:00+00:00", "profile": "normal", "valid": True},
                  {"start": "2026-10-25T01:15:00+00:00", "profile": "normal", "valid": True},
              ]
              evaluations = [
                  {"start": item["start"], "profile": "normal", "actual_kwh": 1.0, "forecast_kwh": 1.0}
                  for item in records
              ]
              result = calculate_daypart_quality(evaluations, records, "normal", _localize)
              assert result["dayparts"]["night"]["sample_count"] == 2
              assert result["dayparts"]["night"]["valid_actual_quarters"] == 2
          PY

          cat > tests/test_energy_daypart_sensor_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def test_daypart_sensor_has_exact_public_identity_and_is_registered():
              sensor = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()
              init = (ROOT / "custom_components/dummy_os_data/__init__.py").read_text()
              migrations = (ROOT / "custom_components/dummy_os_data/entity_migrations.py").read_text()
              assert '_attr_unique_id = "do_energy_forecast_quality_by_daypart"' in sensor
              assert '_attr_suggested_object_id = "do_energy_forecast_quality_by_daypart"' in sensor
              assert 'DummyOSHomeForecastQualityByDaypartSensor(coordinator)' in sensor
              assert '("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart")' in init
              assert '"do_energy_forecast_quality_by_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart"' in migrations


          def test_daypart_sensor_is_observer_only_and_keeps_native_architecture():
              sensor = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()
              const = (ROOT / "custom_components/dummy_os_data/const.py").read_text()
              assert '"observer_only": True' in sensor
              assert '"daypart_basis": "local_quarter_start"' in sensor
              assert "QUARTER_MINUTES = 15" in const
              assert "FORECAST_HORIZON_HOURS = 72" in const
              assert "FORECAST_SLOTS = FORECAST_HORIZON_HOURS * 60 // QUARTER_MINUTES" in const
          PY

      - name: Update release consistency contract for new public Energy sensor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_release_consistency.py')
          text = path.read_text()
          anchor = '    "do_energy_forecast_evaluation_samples",\n'
          addition = '    "do_energy_forecast_quality_by_daypart",\n'
          if addition not in text:
              text = text.replace(anchor, anchor + addition)
          text = text.replace('self.assertEqual(14, sum(sensor_source.count', 'self.assertEqual(15, sum(sensor_source.count')
          path.write_text(text)
          PY

      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data

      - name: Run Step 3 and regression tests
        run: python -m pytest -q tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-energy-step3.yml

      - name: Commit Step 3 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/evaluation.py custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/__init__.py custom_components/dummy_os_data/entity_migrations.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_release_consistency.py .github/workflows/apply-energy-step3.yml
          git commit -m 'Add Energy daypart quality diagnostics'
          git push origin HEAD:energy-step3-daypart-quality
