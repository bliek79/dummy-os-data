name: Prepare Dummy OS Forecast alpha.12.15 identity gate

on:
  push:
    branches:
      - fix-time-windows-identity-gate
    paths:
      - .github/workflows/prepare-alpha12-15-identity-gate.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-time-windows-identity-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply identity gate fix
        run: python scripts/apply_alpha12_15_identity_gate.py
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify Time Windows canonical identity
        run: |
          grep -F '("sensor", "do_energy_time_windows", "sensor.do_energy_time_windows")' custom_components/dummy_os_data/__init__.py
          grep -F '"do_energy_time_windows": "sensor.dummy_os_forecast_do_energy_time_windows"' custom_components/dummy_os_data/entity_migrations.py
          grep -F 'VERSION = "0.1.0-alpha.12.15"' custom_components/dummy_os_data/const.py
      - name: Commit prepared hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/__init__.py custom_components/dummy_os_data/entity_migrations.py custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize alpha.12.15 Time Windows identity gate fix'
          git push origin HEAD:fix-time-windows-identity-gate
