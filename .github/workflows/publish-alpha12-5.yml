name: Publish Dummy OS Forecast alpha.12.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha12-5.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Solar horizon hotfix
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path); t = p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'Expected block missing: {path}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          rep('custom_components/dummy_os_data/solar_model.py',
              '''def next_complete_slot(timestamp: datetime, resolution_minutes: int = 15) -> datetime:\n    """Return the current boundary only when exactly on it, otherwise the next."""\n    floor_minute = (timestamp.minute // resolution_minutes) * resolution_minutes\n    floor = timestamp.replace(minute=floor_minute, second=0, microsecond=0)\n    return floor if timestamp == floor else floor + timedelta(minutes=resolution_minutes)\n''',
              '''def floor_slot_start(timestamp: datetime, resolution_minutes: int = 15) -> datetime:\n    """Return the exact start boundary of the slot containing timestamp."""\n    floor_minute = (timestamp.minute // resolution_minutes) * resolution_minutes\n    return timestamp.replace(minute=floor_minute, second=0, microsecond=0)\n\n\ndef next_complete_slot(timestamp: datetime, resolution_minutes: int = 15) -> datetime:\n    """Return the current boundary only when exactly on it, otherwise the next."""\n    floor = floor_slot_start(timestamp, resolution_minutes)\n    return floor if timestamp == floor else floor + timedelta(minutes=resolution_minutes)\n''')

          rep('custom_components/dummy_os_data/solar.py',
              '    backward_average_slot_start,\n    next_complete_slot,\n',
              '    backward_average_slot_start,\n    floor_slot_start,\n    next_complete_slot,\n')
          rep('custom_components/dummy_os_data/solar.py',
              '''        now_utc = dt_util.as_utc(now)\n        self._integrate_actual_until(now_utc)\n        self._finalize_quarter(now_utc)\n        self._capture_horizon_snapshots(now_utc)\n        # This callback is registered for the exact quarter boundary. Use that\n        # logical boundary as capture time so event-loop latency does not turn\n        # an on-time immutable snapshot into a false "late forecast" result.\n        self._start_quarter(now_utc, scheduled_boundary=True)\n        self._set_actual_sample(now_utc)\n''',
              '''        now_utc = dt_util.as_utc(now)\n        boundary_utc = floor_slot_start(now_utc, QUARTER_MINUTES)\n        self._integrate_actual_until(boundary_utc)\n        self._finalize_quarter(boundary_utc)\n        self._capture_horizon_snapshots(boundary_utc)\n        if self.last_evaluation is not None:\n            self.last_evaluation["pending_horizon_snapshot_count"] = len(self._horizon_snapshots)\n            self.last_evaluation["horizon_capture_boundary"] = boundary_utc.isoformat()\n        self._start_quarter(boundary_utc, scheduled_boundary=True)\n        self._set_actual_sample(boundary_utc)\n''')

          rep('custom_components/dummy_os_data/entity_migrations.py',
              '    "do_solar_evaluation_last_completed_quarter": "sensor.dummy_os_solar_evaluation_last_completed_quarter",\n    "do_solar_model": "sensor.dummy_os_solar_forecast_model",\n',
              '    "do_solar_evaluation_last_completed_quarter": "sensor.dummy_os_solar_evaluation_last_completed_quarter",\n    "do_solar_evaluation_horizon_1h": "sensor.dummy_os_solar_evaluation_horizon_1h",\n    "do_solar_evaluation_horizon_6h": "sensor.dummy_os_solar_evaluation_horizon_6h",\n    "do_solar_evaluation_horizon_24h": "sensor.dummy_os_solar_evaluation_horizon_24h",\n    "do_solar_evaluation_horizon_48h": "sensor.dummy_os_solar_evaluation_horizon_48h",\n    "do_solar_evaluation_horizon_72h": "sensor.dummy_os_solar_evaluation_horizon_72h",\n    "do_solar_model": "sensor.dummy_os_solar_forecast_model",\n')

          rep('custom_components/dummy_os_data/__init__.py',
              '    ("sensor", "do_solar_evaluation_last_completed_quarter", "sensor.do_solar_evaluation_last_completed_quarter"),\n    ("sensor", "do_solar_model", "sensor.do_solar_model"),\n',
              '    ("sensor", "do_solar_evaluation_last_completed_quarter", "sensor.do_solar_evaluation_last_completed_quarter"),\n    ("sensor", "do_solar_evaluation_horizon_1h", "sensor.do_solar_evaluation_horizon_1h"),\n    ("sensor", "do_solar_evaluation_horizon_6h", "sensor.do_solar_evaluation_horizon_6h"),\n    ("sensor", "do_solar_evaluation_horizon_24h", "sensor.do_solar_evaluation_horizon_24h"),\n    ("sensor", "do_solar_evaluation_horizon_48h", "sensor.do_solar_evaluation_horizon_48h"),\n    ("sensor", "do_solar_evaluation_horizon_72h", "sensor.do_solar_evaluation_horizon_72h"),\n    ("sensor", "do_solar_model", "sensor.do_solar_model"),\n')

          rep('custom_components/dummy_os_data/solar_sensor.py',
              '        self._attr_name = f"DO Solar Evaluation Horizon {horizon_hours}h"\n',
              '        self._attr_name = f"Solar Evaluation Horizon {horizon_hours}h"\n')

          rep('custom_components/dummy_os_data/const.py', 'VERSION = "0.1.0-alpha.12.4"', 'VERSION = "0.1.0-alpha.12.5"')
          rep('custom_components/dummy_os_data/manifest.json', '"version": "0.1.0-alpha.12.4"', '"version": "0.1.0-alpha.12.5"')

          p = Path('tests/test_solar_model.py'); t = p.read_text(encoding='utf-8')
          marker = '    def test_next_complete_slot_after_boundary(self) -> None:\n'
          ins = '''    def test_floor_slot_start_removes_scheduler_latency(self) -> None:\n        stamp = datetime(2026, 9, 3, 15, 45, 0, 932780, tzinfo=timezone.utc)\n        self.assertEqual(\n            solar_model.floor_slot_start(stamp),\n            datetime(2026, 9, 3, 15, 45, tzinfo=timezone.utc),\n        )\n\n'''
          if ins not in t:
              if marker not in t: raise SystemExit('test insertion marker missing')
              p.write_text(t.replace(marker, ins + marker, 1), encoding='utf-8')

          Path('tests/test_solar_horizon_runtime_contract.py').write_text('''from pathlib import Path\nROOT = Path(__file__).resolve().parents[1]\n\ndef test_runtime_boundary_and_ids():\n    solar = (ROOT / "custom_components/dummy_os_data/solar.py").read_text()\n    init = (ROOT / "custom_components/dummy_os_data/__init__.py").read_text()\n    mig = (ROOT / "custom_components/dummy_os_data/entity_migrations.py").read_text()\n    assert "boundary_utc = floor_slot_start(now_utc, QUARTER_MINUTES)" in solar\n    assert "self._capture_horizon_snapshots(boundary_utc)" in solar\n    for h in (1, 6, 24, 48, 72):\n        u = f"do_solar_evaluation_horizon_{h}h"\n        assert f'(\"sensor\", \"{u}\", \"sensor.{u}\")' in init\n        assert f'\"{u}\": \"sensor.dummy_os_solar_evaluation_horizon_{h}h\"' in mig\n''', encoding='utf-8')

          Path('RELEASE_NOTES.md').write_text('''# GitHub Release\n\n**Tag:** `0.1.0-alpha.12.5`\n\n**Release title:** `Dummy OS Forecast 0.1.0-alpha.12.5 - Solar Horizon Runtime & Identity Hotfix`\n\n## Dummy OS Forecast 0.1.0-alpha.12.5\n\nGerichte hotfix voor Solar horizonvalidatie en de afgesproken canonieke entity-ID's.\n\n### Opgelost\n- Scheduler-latency wordt vóór horizoncapture teruggebracht naar de exacte 15-minuten boundary.\n- `pending_horizon_snapshot_count` wordt na capture bijgewerkt; `horizon_capture_boundary` wordt zichtbaar voor diagnose.\n- De vijf verkeerd automatisch gegenereerde horizon-IDs migreren veilig naar `sensor.do_solar_evaluation_horizon_1h`, `_6h`, `_24h`, `_48h`, `_72h`.\n- Zichtbare namen zijn opgeschoond naar `Dummy OS Forecast Solar Evaluation Horizon <h>h`.\n- Nieuwe regressietests bewaken runtime-boundary en alle vijf identity-contracten.\n\n### Ongewijzigd\n- Native architectuur blijft 15 minuten / 72 uur / 288 slots.\n- Solar-model, Energy, Weather, Prices, Degree Days en fysieke EMS-sturing zijn functioneel ongewijzigd.\n\n### Live validatie\n1. Na installatie moeten alleen de canonieke `sensor.do_solar_evaluation_horizon_*` IDs overblijven.\n2. Na de eerstvolgende kwartiergrens moet `pending_horizon_snapshot_count` > 0 worden.\n3. Na minimaal 1 uur moet de 1h-sensor een echte `snapshot_id` krijgen.\n4. Daarna kan de Sheets-automation de eerste horizonregel exporteren.\n''', encoding='utf-8')

      - name: Validate
        run: |
          python -m compileall custom_components/dummy_os_data
          python -m pytest -q

      - name: Commit and push hotfix
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests RELEASE_NOTES.md
          git commit -m "Fix Solar horizon runtime and canonical IDs for alpha.12.5"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        run: |
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip custom_components/dummy_os_data >/dev/null
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip | tee SHA256SUMS-alpha12.5.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag 0.1.0-alpha.12.5 "${{ steps.commit.outputs.sha }}"
          git push origin 0.1.0-alpha.12.5
          gh release create 0.1.0-alpha.12.5 --title "Dummy OS Forecast 0.1.0-alpha.12.5 - Solar Horizon Runtime & Identity Hotfix" --notes-file RELEASE_NOTES.md --prerelease Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip SHA256SUMS-alpha12.5.txt

      - name: Remove temporary workflow
        if: success()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/publish-alpha12-5.yml
          git commit -m "Remove temporary alpha.12.5 publish workflow"
          git push origin main
