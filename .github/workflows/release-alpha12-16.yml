name: Release Dummy OS Forecast alpha.12.16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-alpha12-16.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Compile release sources
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run full release tests
        run: python -m pytest -q
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify full observer identity gate
        run: |
          grep -F 'VERSION = "0.1.0-alpha.12.16"' custom_components/dummy_os_data/const.py
          grep -F '_attr_unique_id = "do_energy_time_windows"' custom_components/dummy_os_data/sensor.py
          grep -F '_attr_suggested_object_id = "do_energy_time_windows"' custom_components/dummy_os_data/sensor.py
          grep -F 'return "DO Energy Time Windows"' custom_components/dummy_os_data/sensor.py
          grep -F 'return "DO Energy Peak Learning"' custom_components/dummy_os_data/sensor.py
          grep -F '("sensor", "do_energy_time_windows", "sensor.do_energy_time_windows")' custom_components/dummy_os_data/__init__.py
          grep -F 'FORECAST_HORIZON_HOURS = 72' custom_components/dummy_os_data/const.py
      - name: Build Home Assistant install ZIP
        run: |
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.16_HA_install.zip custom_components/dummy_os_data -x '*/__pycache__/*' '*.pyc'
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.16_HA_install.zip > SHA256SUMS-alpha12.16.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.1.0-alpha.12.16 \
            Dummy_OS_Forecast_0.1.0-alpha.12.16_HA_install.zip \
            SHA256SUMS-alpha12.16.txt \
            --target "$GITHUB_SHA" \
            --title 'Dummy OS Forecast 0.1.0-alpha.12.16 - Observer Runtime Name Fix' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
