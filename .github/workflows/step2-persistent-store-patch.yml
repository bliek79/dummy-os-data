name: Apply Energy Step 2 persistence integration

on:
  push:
    branches:
      - energy-step2-persistent-store-schema
    paths:
      - .github/workflows/step2-persistent-store-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: energy-step2-persistent-store-schema

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Patch coordinator persistence contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/dummy_os_data/coordinator.py')
          text = path.read_text()

          text = text.replace(
              '    CANONICAL_HOME_POWER_ENTITY,\n    MAX_HISTORY_DAYS,',
              '    CANONICAL_HOME_POWER_ENTITY,\n    ENERGY_EVALUATION_SCHEMA_VERSION,\n    ENERGY_STORE_SCHEMA_VERSION,\n    MAX_HISTORY_DAYS,',
          )
          text = text.replace(
              'from .evaluation import calculate_metrics\n',
              'from .energy_store import normalize_energy_store_payload\nfrom .evaluation import calculate_metrics\n',
          )
          text = text.replace(
              '        stored = await self.store.async_load() or {}\n        self.profile = stored.get("profile", PROFILE_NORMAL)\n',
              '        stored = normalize_energy_store_payload(\n'
              '            await self.store.async_load(),\n'
              '            current_schema_version=ENERGY_STORE_SCHEMA_VERSION,\n'
              '            default_profile=PROFILE_NORMAL,\n'
              '        )\n'
              '        self.profile = stored.get("profile", PROFILE_NORMAL)\n',
          )
          text = text.replace(
              '                "start": result.start.isoformat(),\n                "end": result.end.isoformat(),\n                "profile": result.profile,\n                "forecast_kwh": round(forecast_kwh, 6),',
              '                "evaluation_schema_version": ENERGY_EVALUATION_SCHEMA_VERSION,\n'
              '                "start": result.start.isoformat(),\n'
              '                "end": result.end.isoformat(),\n'
              '                "profile": result.profile,\n'
              '                "forecast_kwh": round(forecast_kwh, 6),',
          )
          text = text.replace(
              '            {\n                "profile": self.profile,\n                "records": self.records,',
              '            {\n'
              '                "energy_store_schema_version": ENERGY_STORE_SCHEMA_VERSION,\n'
              '                "profile": self.profile,\n'
              '                "records": self.records,',
          )

          required = (
              'ENERGY_STORE_SCHEMA_VERSION',
              'ENERGY_EVALUATION_SCHEMA_VERSION',
              'normalize_energy_store_payload(',
              '"energy_store_schema_version": ENERGY_STORE_SCHEMA_VERSION',
              '"evaluation_schema_version": ENERGY_EVALUATION_SCHEMA_VERSION',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing expected coordinator marker: {marker}')

          path.write_text(text)
          PY

      - name: Extend Step 2 contract test
        run: |
          cat >> tests/test_energy_store_schema.py <<'PY'

          def test_coordinator_uses_versioned_energy_store_contract():
              coordinator = (ROOT / "custom_components/dummy_os_data/coordinator.py").read_text()
              assert "ENERGY_STORE_SCHEMA_VERSION" in coordinator
              assert "ENERGY_EVALUATION_SCHEMA_VERSION" in coordinator
              assert "normalize_energy_store_payload(" in coordinator
              assert '"energy_store_schema_version": ENERGY_STORE_SCHEMA_VERSION' in coordinator
              assert '"evaluation_schema_version": ENERGY_EVALUATION_SCHEMA_VERSION' in coordinator
          PY

      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data

      - name: Run targeted tests
        run: python -m pytest -q tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py

      - name: Remove temporary patch workflow
        run: rm .github/workflows/step2-persistent-store-patch.yml

      - name: Commit Step 2 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/coordinator.py tests/test_energy_store_schema.py .github/workflows/step2-persistent-store-patch.yml
          git commit -m 'Integrate versioned Energy persistence schema'
          git push origin HEAD:energy-step2-persistent-store-schema
