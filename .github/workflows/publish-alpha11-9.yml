name: Publish Dummy OS Data alpha.11.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha11-9.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Validate Python sources
        run: python -m compileall custom_components/dummy_os_data tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate release metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = "0.1.0-alpha.11.9"
          manifest = json.loads(Path("custom_components/dummy_os_data/manifest.json").read_text())
          const = Path("custom_components/dummy_os_data/const.py").read_text()
          notes = Path("RELEASE_NOTES.md").read_text()
          prices = Path("custom_components/dummy_os_data/prices.py").read_text()
          assert manifest["version"] == version
          assert f'VERSION = "{version}"' in const
          assert f"**Tag:** `{version}`" in notes
          assert f"## Dummy OS Data {version}" in notes
          assert "GAS_VARIABLE_ADDON_ENTITY" not in prices
          assert "input_number.gas_markup_per_m3" not in prices
          assert '"gas_variable_addon_source": "dummy_os_data_options"' in prices
          assert '"tariff_edit_surface": "Dummy OS Data Options"' in prices
          PY

      - name: Build Home Assistant installation package
        shell: bash
        run: |
          mkdir -p release/custom_components
          cp -R custom_components/dummy_os_data release/custom_components/
          cd release
          zip -r ../Dummy_OS_Data_0.1.0-alpha.11.9_HA_install.zip custom_components/dummy_os_data
          cd ..
          sha256sum Dummy_OS_Data_0.1.0-alpha.11.9_HA_install.zip > SHA256SUMS-alpha11.9.txt

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "0.1.0-alpha.11.9" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Dummy OS Data 0.1.0-alpha.11.9 - Internal Gas Tariff Profile" \
            --notes-file RELEASE_NOTES.md \
            Dummy_OS_Data_0.1.0-alpha.11.9_HA_install.zip \
            SHA256SUMS-alpha11.9.txt

      - name: Show published checksum
        run: cat SHA256SUMS-alpha11.9.txt
