name: Clean Energy Step 4 generated bytecode
on:
  push:
    branches: [energy-step4-day-type-quality]
    paths: [.github/workflows/cleanup-energy-step4.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-step4-day-type-quality
          fetch-depth: 0
      - name: Remove generated bytecode and temporary workflow
        run: |
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/cleanup-energy-step4.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated bytecode from Energy Step 4 branch'
          git push origin HEAD:energy-step4-day-type-quality
