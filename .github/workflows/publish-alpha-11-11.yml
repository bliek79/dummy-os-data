name: Publish Dummy OS Data alpha.11.11

on:
  push:
    branches:
      - feature/solar-horizon-export-sensors
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall custom_components/dummy_os_data

      - name: Run tests
        run: python -m pytest -q

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = '0.1.0-alpha.11.11'
          manifest = json.loads(Path('custom_components/dummy_os_data/manifest.json').read_text())
          const = Path('custom_components/dummy_os_data/const.py').read_text()
          notes = Path('RELEASE_NOTES.md').read_text()
          assert manifest['version'] == version
          assert f'VERSION = "{version}"' in const
          assert f'**Tag:** `{version}`' in notes
          assert f'## Dummy OS Data {version}' in notes
          PY

      - name: Build release assets
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION='0.1.0-alpha.11.11'
          ZIP="Dummy_OS_Data_${VERSION}_HA_install.zip"
          zip -r "$ZIP" custom_components/dummy_os_data
          sha256sum "$ZIP" > "SHA256SUMS_${VERSION}.txt"

      - name: Publish prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='0.1.0-alpha.11.11'
          ZIP="Dummy_OS_Data_${VERSION}_HA_install.zip"
          SUM="SHA256SUMS_${VERSION}.txt"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" "$ZIP" "$SUM" \
            --prerelease \
            --title "Dummy OS Data 0.1.0-alpha.11.11 - Solar Horizon Export Sensors" \
            --notes-file RELEASE_NOTES.md

      - name: Remove temporary workflow
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-alpha-11-11.yml
          git commit -m 'Remove temporary alpha.11.11 release workflow [skip ci]'
          git push origin main
