name: Alpha34 verified source build
on:
  push:
    branches: [alpha34-sequential-safety-fix]
    paths: [.github/workflows/alpha34-build-review.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Verify and apply exact source edits
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          entries = []
          for part in range(4):
              entries.extend(json.loads(Path(f'.github/alpha34_patch_{part}.json').read_text()))
          assert len(entries) == 17
          outputs = {}
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('custom_components/dummy_os_data/', 'tests/', 'docs/', 'examples/', 'RELEASE_NOTES_', '.github/workflows/publish-alpha34.yml'))
              assert path not in outputs
              old = path.read_text() if path.exists() else ''
              digest = hashlib.sha256(old.encode()).hexdigest() if path.exists() else None
              if digest == entry['after']:
                  outputs[path] = old
                  continue
              assert digest == entry['before'], f'Source changed: {path}'
              new = old
              previous_start = len(old) + 1
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(old) and end <= previous_start
                  new = new[:start] + replacement + new[end:]
                  previous_start = start
              assert hashlib.sha256(new.encode()).hexdigest() == entry['after'], f'Output mismatch: {path}'
              outputs[path] = new
          for path, content in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
              print(f'Verified: {path}')
          Path('/tmp/alpha34_expected.json').write_text(json.dumps({e['path']: e['after'] for e in entries}, indent=2))
          PY
      - name: Full regression gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          python -m pytest -q | tee /tmp/alpha34-full-tests.txt
          python -m pytest -q tests/test_alpha34_sequential_safety.py tests/test_alpha33_reserve_safety_hourly_fix.py tests/test_alpha32_native_planner_parity.py tests/test_alpha31_resilient_planner.py tests/test_alpha30_startup_performance.py tests/test_alpha29_price_buffer.py tests/test_do_plan_input.py tests/test_do_plan_energy_need.py tests/test_do_plan_reserve_soc.py tests/test_do_plan_grid_support.py tests/test_do_plan_preview.py tests/test_do_plan_72h.py | tee /tmp/alpha34-targeted-tests.txt
          git diff --check
      - name: Commit verified implementation on isolated branch
        run: |
          test "$GITHUB_REF_NAME" = alpha34-sequential-safety-fix
          python - <<'PY'
          import json, subprocess
          paths = list(json.load(open('/tmp/alpha34_expected.json')))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Alpha34: one replay-validated safety plan and exact native handoff'
          git push origin HEAD:alpha34-sequential-safety-fix
          git rev-parse HEAD | tee /tmp/alpha34-verified-commit.txt
          git archive --format=tar.gz HEAD > /tmp/alpha34-verified-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: alpha34-verified-source-and-tests
          path: |
            /tmp/alpha34-verified-source.tar.gz
            /tmp/alpha34-verified-commit.txt
            /tmp/alpha34_expected.json
            /tmp/alpha34-full-tests.txt
            /tmp/alpha34-targeted-tests.txt
          retention-days: 7
