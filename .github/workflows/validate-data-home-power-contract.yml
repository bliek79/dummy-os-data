name: Validate Data Home Power contract

on:
  push:
    branches:
      - fix/data-home-power-sources-and-ids
    paths:
      - custom_components/dummy_os_data/**
      - tests/**
      - .github/workflows/validate-data-home-power-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Compile Python sources
        run: python -m compileall custom_components/dummy_os_data tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('custom_components/dummy_os_data/manifest.json'),
              Path('custom_components/dummy_os_data/strings.json'),
              Path('custom_components/dummy_os_data/translations/en.json'),
              Path('custom_components/dummy_os_data/translations/nl.json'),
          ]:
              json.loads(path.read_text())
              print('ok', path)
          PY
