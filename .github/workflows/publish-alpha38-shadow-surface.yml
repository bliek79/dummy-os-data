name: Publish alpha.38 shadow surface

on:
  push:
    branches: [ems-copy-alpha76-parity]
    paths:
      - .github/workflows/publish-alpha38-shadow-surface.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest pytest-asyncio

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/dummy_os_data tests

      - name: Verify vendored alpha76 source against immutable tag
        run: |
          grep -F 'SOURCE_TAG = "0.0.1-alpha.76"' custom_components/dummy_os_data/ems_alpha76/__init__.py
          test -f custom_components/dummy_os_data/ems_alpha76/SOURCE_HASHES.json
          git clone --quiet --depth 1 --branch 0.0.1-alpha.76 https://github.com/bliek79/dummy-os-anker-ems.git /tmp/alpha76
          for f in energy_need.py planner_preview.py planner_72h.py planner_action_bridge.py plan_store.py scheduler.py prestart_validator.py safety_guard.py action_controller.py execution.py; do
            cmp "/tmp/alpha76/custom_components/anker_ems/$f" "custom_components/dummy_os_data/ems_alpha76/$f"
          done
          python - <<'PY'
          from pathlib import Path
          old = Path('/tmp/alpha76/custom_components/anker_ems/const.py').read_text()
          vendored = Path('custom_components/dummy_os_data/ems_alpha76/const.py').read_text()
          vendored = vendored.replace('DOMAIN = "dummy_os_data"', 'DOMAIN = "anker_ems"', 1)
          assert vendored == old, 'vendored const.py differs beyond isolated DOMAIN replacement'
          PY

      - name: Run golden EMS parity fixtures
        run: python -m pytest -q tests/test_ems_alpha76_core_parity.py tests/test_ems_alpha76_quarter_offset_parity.py tests/test_ems_alpha76_full_chain_parity.py tests/test_ems_alpha76_public_contract.py

      - name: Run non-retired regression suite
        run: |
          python -m pytest -q \
            --ignore=tests/test_ems_alpha76_core_parity.py \
            --ignore=tests/test_ems_alpha76_quarter_offset_parity.py \
            --ignore=tests/test_ems_alpha76_full_chain_parity.py \
            --ignore=tests/test_ems_alpha76_public_contract.py

      - name: Verify Step 8B alpha76 shadow-surface contract
        run: |
          python -m pytest -q tests/test_step8b_alpha76_shadow_surface_contract.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path('custom_components/dummy_os_data')
          version = next(
              ast.literal_eval(node.value)
              for node in ast.parse((root / 'const.py').read_text()).body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == 'VERSION' for t in node.targets)
          )
          assert version == json.loads((root / 'manifest.json').read_text())['version'] == '0.2.0-alpha.38'

          surface = (root / 'ems_alpha76_surface.py').read_text()
          runtime = (root / 'ems_alpha76_runtime.py').read_text()
          number = (root / 'number.py').read_text()
          datetime_py = (root / 'datetime.py').read_text()
          select = (root / 'select.py').read_text()
          binary = (root / 'binary_sensor.py').read_text()
          bundle = (root / 'do_plan_grid_support_sensor.py').read_text()

          assert 'self.plan_store = runtime.plan_store' in surface
          assert 'await self.plan_store.async_set_value' in surface
          assert 'build_alpha76_plan_number_entities' in number
          assert 'build_alpha76_plan_datetime_entities' in datetime_py
          assert 'build_alpha76_plan_select_entities' in select
          assert 'build_alpha76_binary_sensors' in binary
          assert 'build_alpha76_status_sensors(coordinator)' in bundle
          assert 'DummyOSPlanStoreBridgeSensor' not in bundle
          assert 'build_do_plan_store_sensors' not in bundle
          assert 'build_do_plan_scheduler_sensors(coordinator)' not in bundle
          assert 'build_do_plan_safety_sensors(coordinator)' not in bundle
          assert 'build_do_plan_execution_preview_sensors(coordinator)' not in bundle

          assert '"shadow_only": True' in surface
          assert '"physical_execution_authority": False' in surface
          assert 'data["alpha76_physical_autostart_wired"] = False' in runtime
          assert 'def simulation_mode' in runtime and 'return True' in runtime
          assert '.async_execute_automatic_plan(' not in surface
          assert '.async_execute_automatic_plan(' not in runtime

          assert '"alpha76_input_resolution_minutes": 15' in runtime
          assert '"alpha76_input_slot_count": 288' in runtime
          assert '"forecast_horizon_hours": 72' in runtime
          assert Path('RELEASE_NOTES_0.2.0-alpha.38.md').is_file()
          PY

      - name: Package and verify tested sources
        run: |
          mkdir -p dist
          python - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path('custom_components/dummy_os_data')
          sources = [
              p for p in root.rglob('*')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'
          ]
          target = Path('dist/Dummy_OS_Energy_0.2.0-alpha.38_HA_install.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(sources):
                  archive.write(p, p.relative_to(root.parent))
          with zipfile.ZipFile(target) as archive:
              for p in sources:
                  assert archive.read(str(p.relative_to(root.parent))) == p.read_bytes(), str(p)
              assert not any('__pycache__' in name or name.endswith('.pyc') for name in archive.namelist())
          PY
          sha256sum dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS-0.2.0-alpha.38.txt

      - name: Publish controlled shadow prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 0.2.0-alpha.38 -m 'Dummy OS Energy 0.2.0-alpha.38 - Alpha76 Shadow Surface Parity'
          git push origin 0.2.0-alpha.38
          gh release create 0.2.0-alpha.38 dist/*.zip dist/SHA256SUMS-0.2.0-alpha.38.txt \
            --title 'Dummy OS Energy 0.2.0-alpha.38 - Alpha76 Shadow Surface Parity' \
            --notes-file RELEASE_NOTES_0.2.0-alpha.38.md --prerelease --verify-tag
