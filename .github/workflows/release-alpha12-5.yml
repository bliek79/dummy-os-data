name: Release Dummy OS Forecast alpha.12.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-alpha12-5.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source
        run: |
          python -m compileall custom_components/dummy_os_data
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components tests -type f -name '*.pyc' -delete
          python -m pip install pytest
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/dummy_os_data/manifest.json').read_text())
          assert manifest['version'] == '0.1.0-alpha.12.5'
          assert 'VERSION = "0.1.0-alpha.12.5"' in Path('custom_components/dummy_os_data/const.py').read_text()
          notes = Path('RELEASE_NOTES.md').read_text()
          assert '**Tag:** `0.1.0-alpha.12.5`' in notes
          PY

      - name: Build release assets
        run: |
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip custom_components/dummy_os_data -x '*__pycache__*' '*.pyc' >/dev/null
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip | tee SHA256SUMS-alpha12.5.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="0.1.0-alpha.12.5"
          git tag "$TAG" "${GITHUB_SHA}"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Dummy OS Forecast 0.1.0-alpha.12.5 - Solar Horizon Runtime & Identity Hotfix" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip \
            SHA256SUMS-alpha12.5.txt
