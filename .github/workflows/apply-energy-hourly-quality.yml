name: Apply Energy hourly quality diagnostic

on:
  push:
    branches:
      - energy-hourly-quality-diagnostic
    paths:
      - .github/workflows/apply-energy-hourly-quality.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-hourly-quality-diagnostic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Patch implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          # evaluation.py
          p = Path('custom_components/dummy_os_data/evaluation.py')
          s = p.read_text()
          append = '''\n\nAFTERNOON_HOUR_MINIMUM_SAMPLES = 32\nAFTERNOON_HOURS: tuple[int, ...] = tuple(range(12, 18))\n\ndef calculate_hour_quality(evaluations: list[dict[str, Any]], records: list[dict[str, Any]], profile: str, localize) -> dict[str, Any]:\n    \"\"\"Calculate observer-only Energy quality per local afternoon hour.\"\"\"\n    valid_actual_counts = {hour: 0 for hour in AFTERNOON_HOURS}\n    selected = {hour: [] for hour in AFTERNOON_HOURS}\n    for record in records:\n        if record.get(\"profile\") != profile or record.get(\"valid\") is not True:\n            continue\n        start = _parse_aware_start(record.get(\"start\"))\n        if start is None:\n            continue\n        hour = localize(start).hour\n        if hour in valid_actual_counts:\n            valid_actual_counts[hour] += 1\n    for item in evaluations:\n        if item.get(\"profile\") != profile:\n            continue\n        start = _parse_aware_start(item.get(\"start\"))\n        if start is None:\n            continue\n        try:\n            float(item[\"actual_kwh\"]); float(item[\"forecast_kwh\"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        hour = localize(start).hour\n        if hour in selected:\n            selected[hour].append(item)\n    result = {}; all_sufficient = True\n    for hour in AFTERNOON_HOURS:\n        metrics = calculate_metrics(selected[hour], profile=None)\n        samples = int(metrics[\"samples\"]); denominator = valid_actual_counts[hour]\n        coverage = round(min(100.0, samples / denominator * 100.0), 1) if denominator > 0 else None\n        status = \"sufficient_basis\" if samples >= AFTERNOON_HOUR_MINIMUM_SAMPLES else \"collecting\"\n        all_sufficient = all_sufficient and status == \"sufficient_basis\"\n        result[f\"hour_{hour:02d}\"] = {\n            \"start_local\": f\"{hour:02d}:00\",\n            \"end_local\": f\"{hour + 1:02d}:00\",\n            \"status\": status,\n            \"sample_count\": samples,\n            \"mae_kwh\": metrics[\"mae_kwh\"],\n            \"bias_kwh\": metrics[\"bias_kwh\"],\n            \"evaluation_coverage_percent\": coverage,\n            \"accuracy_percent\": metrics[\"accuracy_percent\"],\n            \"valid_actual_quarters\": denominator,\n        }\n    return {\n        \"profile\": profile,\n        \"status\": \"sufficient_basis\" if all_sufficient else \"collecting\",\n        \"minimum_samples_for_sufficient_basis\": AFTERNOON_HOUR_MINIMUM_SAMPLES,\n        \"observer_only\": True,\n        \"scope\": \"afternoon_12_18\",\n        \"hours\": result,\n    }\n'''
          if 'def calculate_hour_quality(' not in s:
              s += append
          p.write_text(s)

          # sensor.py import/register/class
          p = Path('custom_components/dummy_os_data/sensor.py')
          s = p.read_text()
          s = s.replace('from .evaluation import calculate_day_type_daypart_quality, calculate_day_type_quality, calculate_daypart_quality',
                        'from .evaluation import calculate_day_type_daypart_quality, calculate_day_type_quality, calculate_daypart_quality, calculate_hour_quality')
          s = s.replace('            DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator),\n',
                        '            DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator),\n            DummyOSHomeForecastQualityByHourSensor(coordinator),\n')
          marker = '\n\nclass DummyOSWeatherCurrentSensor(DummyOSWeatherBaseSensor):\n'
          cls = '''\n\nclass DummyOSHomeForecastQualityByHourSensor(DummyOSBaseSensor):\n    \"\"\"Observer-only Energy forecast quality per local afternoon hour.\"\"\"\n    _attr_name = \"DO Energy Forecast Quality By Hour\"\n    _attr_unique_id = \"do_energy_forecast_quality_by_hour\"\n    _attr_suggested_object_id = \"do_energy_forecast_quality_by_hour\"\n    _attr_icon = \"mdi:clock-outline\"\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_hour_quality(self.coordinator.evaluations, self.coordinator.records, self.coordinator.profile, dt_util.as_local)\n    @property\n    def native_value(self) -> str: return str(self._quality[\"status\"])\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        q=self._quality; return {\"profile\":q[\"profile\"],\"observer_only\":True,\"resolution_minutes\":15,\"minimum_samples_for_sufficient_basis\":q[\"minimum_samples_for_sufficient_basis\"],\"hour_basis\":\"local_quarter_start\",\"scope\":q[\"scope\"],\"hours\":q[\"hours\"]}\n'''
          if 'class DummyOSHomeForecastQualityByHourSensor' not in s:
              s = s.replace(marker, cls + marker)
          p.write_text(s)

          # entity_migrations.py
          p = Path('custom_components/dummy_os_data/entity_migrations.py')
          s = p.read_text()
          old = '    \"do_energy_forecast_quality_by_day_type_and_daypart\": \"sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type_and_daypart\",\n'
          new = old + '    \"do_energy_forecast_quality_by_hour\": \"sensor.dummy_os_forecast_do_energy_forecast_quality_by_hour\",\n'
          if 'do_energy_forecast_quality_by_hour' not in s:
              s = s.replace(old, new)
          p.write_text(s)

          # __init__.py
          p = Path('custom_components/dummy_os_data/__init__.py')
          s = p.read_text()
          old = '    (\"sensor\", \"do_energy_forecast_quality_by_day_type_and_daypart\", \"sensor.do_energy_forecast_quality_by_day_type_and_daypart\"),\n'
          new = old + '    (\"sensor\", \"do_energy_forecast_quality_by_hour\", \"sensor.do_energy_forecast_quality_by_hour\"),\n'
          if 'do_energy_forecast_quality_by_hour' not in s:
              s = s.replace(old, new)
          p.write_text(s)

          # release consistency
          p = Path('tests/test_release_consistency.py')
          s = p.read_text()
          old = '    \"do_energy_forecast_quality_by_day_type_and_daypart\",\n'
          new = old + '    \"do_energy_forecast_quality_by_hour\",\n'
          if 'do_energy_forecast_quality_by_hour' not in s:
              s = s.replace(old, new)
          s = s.replace('self.assertEqual(17, sum(sensor_source.count(f\'_attr_unique_id = \"{unique_id}\"\') for unique_id in EXPECTED_ENERGY_IDS))',
                        'self.assertEqual(18, sum(sensor_source.count(f\'_attr_unique_id = \"{unique_id}\"\') for unique_id in EXPECTED_ENERGY_IDS))')
          p.write_text(s)
          PY
      - name: Write tests
        run: |
          cat > tests/test_energy_hour_quality.py <<'PY'
          import importlib.util
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('custom_components/dummy_os_data/evaluation.py')
          spec = importlib.util.spec_from_file_location('energy_evaluation_hour', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)

          def localize(value):
              return value

          def item(hour, minute, actual=0.2, forecast=0.3, profile='normal'):
              return {'start': datetime(2026, 9, 1, hour, minute, tzinfo=timezone.utc).isoformat(), 'profile': profile, 'actual_kwh': actual, 'forecast_kwh': forecast}

          def record(hour, minute, valid=True, profile='normal'):
              return {'start': datetime(2026, 9, 1, hour, minute, tzinfo=timezone.utc).isoformat(), 'profile': profile, 'valid': valid}

          def test_exact_afternoon_hour_boundaries():
              evaluations = [item(11,45), item(12,0), item(12,45), item(17,45), item(18,0)]
              records = [record(11,45), record(12,0), record(12,45), record(17,45), record(18,0)]
              q = module.calculate_hour_quality(evaluations, records, 'normal', localize)
              assert q['hours']['hour_12']['sample_count'] == 2
              assert q['hours']['hour_17']['sample_count'] == 1
              assert sum(v['sample_count'] for v in q['hours'].values()) == 3

          def test_profile_split_missing_values_and_metrics():
              evaluations = [item(13,0,0.2,0.3), item(13,15,profile='away'), {'start': item(13,30)['start'], 'profile':'normal', 'actual_kwh':'unknown', 'forecast_kwh':0.3}]
              records = [record(13,0), record(13,15), record(13,30)]
              q = module.calculate_hour_quality(evaluations, records, 'normal', localize)
              h = q['hours']['hour_13']
              assert h['sample_count'] == 1
              assert h['valid_actual_quarters'] == 3
              assert h['evaluation_coverage_percent'] == 33.3
              assert h['mae_kwh'] == 0.1
              assert h['bias_kwh'] == 0.1
              assert h['accuracy_percent'] == 50.0

          def test_all_six_hours_ready_at_32_samples():
              evaluations=[]; records=[]
              for hour in range(12,18):
                  for i in range(32):
                      minute=(i % 4)*15
                      day=1 + i//4
                      start=datetime(2026,9,day,hour,minute,tzinfo=timezone.utc).isoformat()
                      evaluations.append({'start':start,'profile':'normal','actual_kwh':0.2,'forecast_kwh':0.2})
                      records.append({'start':start,'profile':'normal','valid':True})
              q=module.calculate_hour_quality(evaluations,records,'normal',localize)
              assert q['status']=='sufficient_basis'
              assert all(v['status']=='sufficient_basis' for v in q['hours'].values())
              assert set(q['hours']) == {f'hour_{h:02d}' for h in range(12,18)}
          PY

          cat > tests/test_energy_hour_sensor_contract.py <<'PY'
          from pathlib import Path

          def test_hour_sensor_exact_identity_and_contract():
              sensor=Path('custom_components/dummy_os_data/sensor.py').read_text()
              init=Path('custom_components/dummy_os_data/__init__.py').read_text()
              mig=Path('custom_components/dummy_os_data/entity_migrations.py').read_text()
              evaluation=Path('custom_components/dummy_os_data/evaluation.py').read_text()
              assert '_attr_unique_id = "do_energy_forecast_quality_by_hour"' in sensor
              assert '_attr_suggested_object_id = "do_energy_forecast_quality_by_hour"' in sensor
              assert '("sensor", "do_energy_forecast_quality_by_hour", "sensor.do_energy_forecast_quality_by_hour")' in init
              assert '"do_energy_forecast_quality_by_hour": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_hour"' in mig
              assert 'AFTERNOON_HOURS: tuple[int, ...] = tuple(range(12, 18))' in evaluation
              assert '"scope": "afternoon_12_18"' in evaluation
              assert '"hour_basis":"local_quarter_start"' in sensor
          PY
      - name: Run tests
        run: python -m pytest -q tests/test_energy_hour_quality.py tests/test_energy_hour_sensor_contract.py tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Compile
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Cleanup and commit
        run: |
          rm .github/workflows/apply-energy-hourly-quality.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/__init__.py custom_components/dummy_os_data/entity_migrations.py custom_components/dummy_os_data/evaluation.py custom_components/dummy_os_data/sensor.py tests/test_energy_hour_quality.py tests/test_energy_hour_sensor_contract.py tests/test_release_consistency.py .github/workflows/apply-energy-hourly-quality.yml
          git commit -m 'Add observer-only Energy hourly quality diagnostic'
          git push origin HEAD:energy-hourly-quality-diagnostic
