name: Publish Dummy OS Data alpha.11.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha11-10.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Validate Python sources
        run: python -m compileall custom_components/dummy_os_data tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate release metadata and Solar horizon contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = "0.1.0-alpha.11.10"
          manifest = json.loads(Path("custom_components/dummy_os_data/manifest.json").read_text())
          const = Path("custom_components/dummy_os_data/const.py").read_text()
          notes = Path("RELEASE_NOTES.md").read_text()
          solar = Path("custom_components/dummy_os_data/solar.py").read_text()
          assert manifest["version"] == version
          assert f'VERSION = "{version}"' in const
          assert f"**Tag:** `{version}`" in notes
          assert f"## Dummy OS Data {version}" in notes
          assert "SOLAR_HORIZON_HOURS = (1, 6, 24, 48, 72)" in solar
          assert '"horizon_snapshots": self._horizon_snapshots' in solar
          assert 'self._horizon_snapshots.setdefault(snapshot["snapshot_id"], snapshot)' in solar
          assert '"horizon_snapshot_vs_completed_quarter_v1"' in solar
          assert '"horizon_evaluations"' in solar
          assert '"pending_horizon_snapshot_count"' in solar
          PY

      - name: Build Home Assistant installation package
        shell: bash
        run: |
          mkdir -p release/custom_components
          cp -R custom_components/dummy_os_data release/custom_components/
          cd release
          zip -r ../Dummy_OS_Data_0.1.0-alpha.11.10_HA_install.zip custom_components/dummy_os_data
          cd ..
          sha256sum Dummy_OS_Data_0.1.0-alpha.11.10_HA_install.zip > SHA256SUMS-alpha11.10.txt

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "0.1.0-alpha.11.10" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Dummy OS Data 0.1.0-alpha.11.10 - Solar Horizon Snapshots" \
            --notes-file RELEASE_NOTES.md \
            Dummy_OS_Data_0.1.0-alpha.11.10_HA_install.zip \
            SHA256SUMS-alpha11.10.txt

      - name: Show published checksum
        run: cat SHA256SUMS-alpha11.10.txt
