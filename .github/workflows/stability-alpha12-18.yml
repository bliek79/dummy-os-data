name: Validate Dummy OS Forecast alpha.12.18

on:
  push:
    branches:
      - stability-minimal-core-reset
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release metadata and identity baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          release_test = Path('tests/test_release_consistency.py')
          text = release_test.read_text()
          text = text.replace('VERSION = "0.1.0-alpha.12.17"', 'VERSION = "0.1.0-alpha.12.18"')
          release_test.write_text(text)

          replacements = {
              Path('custom_components/dummy_os_data/sensor.py'): (
                  'class DummyOSBaseSensor(SensorEntity):\n    """Base Energy Forecast sensor."""\n\n    _attr_should_poll = False\n',
                  'class DummyOSBaseSensor(SensorEntity):\n    """Base Energy Forecast sensor."""\n\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n',
              ),
              Path('custom_components/dummy_os_data/solar_sensor.py'): (
                  'class DummyOSSolarBaseSensor(SensorEntity):\n    _attr_should_poll = False\n',
                  'class DummyOSSolarBaseSensor(SensorEntity):\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n',
              ),
              Path('custom_components/dummy_os_data/degree_days_sensor.py'): (
                  'class DummyOSDegreeDaysBaseSensor(SensorEntity):\n    """Base entity for the Degree Days feature layer."""\n\n    _attr_should_poll = False\n',
                  'class DummyOSDegreeDaysBaseSensor(SensorEntity):\n    """Base entity for the Degree Days feature layer."""\n\n    _attr_should_poll = False\n    _attr_has_entity_name = False\n',
              ),
              Path('custom_components/dummy_os_data/select.py'): (
                  '    _attr_should_poll = False\n\n    def __init__',
                  '    _attr_should_poll = False\n    _attr_has_entity_name = False\n\n    def __init__',
              ),
          }
          for path, (old, new) in replacements.items():
              data = path.read_text()
              if new not in data:
                  if old not in data:
                      raise SystemExit(f'Identity baseline patch point missing in {path}')
                  path.write_text(data.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_release_consistency.py custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/solar_sensor.py custom_components/dummy_os_data/degree_days_sensor.py custom_components/dummy_os_data/select.py
            git commit -m "Apply alpha.12.18 stable identity baseline"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Validate identity base semantics
        run: |
          grep -q '_attr_has_entity_name = False' custom_components/dummy_os_data/sensor.py
          grep -q '_attr_has_entity_name = False' custom_components/dummy_os_data/solar_sensor.py
          grep -q '_attr_has_entity_name = False' custom_components/dummy_os_data/degree_days_sensor.py
          grep -q '_attr_has_entity_name = False' custom_components/dummy_os_data/select.py
      - name: Run tests
        run: python -m pytest -q
