name: Validate Dummy OS Forecast alpha.12.18

on:
  push:
    branches:
      - stability-minimal-core-reset
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align release consistency test version
        run: |
          if grep -q 'VERSION = "0.1.0-alpha.12.17"' tests/test_release_consistency.py; then
            sed -i 's/VERSION = "0.1.0-alpha.12.17"/VERSION = "0.1.0-alpha.12.18"/' tests/test_release_consistency.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_release_consistency.py
            git commit -m "Align alpha.12.18 release consistency test"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Run tests
        run: python -m pytest -q
