name: Validate Dummy OS Forecast alpha.12.18

on:
  push:
    branches:
      - stability-minimal-core-reset
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Run tests
        run: python -m pytest -q
