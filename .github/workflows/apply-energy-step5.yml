name: Apply Energy Step 5 combined quality

on:
  push:
    branches:
      - energy-step5-day-type-daypart-quality
    paths:
      - .github/workflows/apply-energy-step5.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-step5-day-type-daypart-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Patch Step 5 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluation = Path('custom_components/dummy_os_data/evaluation.py')
          text = evaluation.read_text()
          addition = '''\n\nDAY_TYPE_DAYPART_MINIMUM_SAMPLES = 32\nDAY_TYPE_DAYPART_KEYS: tuple[str, ...] = tuple(\n    f"{day_type}_{daypart}"\n    for day_type in DAY_TYPES\n    for daypart, _, _ in DAYPARTS\n)\n\n\ndef calculate_day_type_daypart_quality(\n    evaluations: list[dict[str, Any]],\n    records: list[dict[str, Any]],\n    profile: str,\n    localize,\n) -> dict[str, Any]:\n    """Calculate observer-only Energy quality per day-type/daypart combination."""\n    valid_actual_counts = {key: 0 for key in DAY_TYPE_DAYPART_KEYS}\n    selected = {key: [] for key in DAY_TYPE_DAYPART_KEYS}\n\n    for record in records:\n        if record.get("profile") != profile or record.get("valid") is not True:\n            continue\n        start = _parse_aware_start(record.get("start"))\n        if start is None:\n            continue\n        local_start = localize(start)\n        key = f"{_day_type_for_local_start(local_start)}_{_daypart_for_local_start(local_start)}"\n        valid_actual_counts[key] += 1\n\n    for item in evaluations:\n        if item.get("profile") != profile:\n            continue\n        start = _parse_aware_start(item.get("start"))\n        if start is None:\n            continue\n        try:\n            float(item["actual_kwh"])\n            float(item["forecast_kwh"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        local_start = localize(start)\n        key = f"{_day_type_for_local_start(local_start)}_{_daypart_for_local_start(local_start)}"\n        selected[key].append(item)\n\n    result: dict[str, Any] = {}\n    all_sufficient = True\n    for key in DAY_TYPE_DAYPART_KEYS:\n        metrics = calculate_metrics(selected[key], profile=None)\n        samples = int(metrics["samples"])\n        denominator = valid_actual_counts[key]\n        coverage = None\n        if denominator > 0:\n            coverage = round(min(100.0, samples / denominator * 100.0), 1)\n        status = "sufficient_basis" if samples >= DAY_TYPE_DAYPART_MINIMUM_SAMPLES else "collecting"\n        if status != "sufficient_basis":\n            all_sufficient = False\n        result[key] = {\n            "status": status,\n            "sample_count": samples,\n            "mae_kwh": metrics["mae_kwh"],\n            "bias_kwh": metrics["bias_kwh"],\n            "evaluation_coverage_percent": coverage,\n            "accuracy_percent": metrics["accuracy_percent"],\n            "valid_actual_quarters": denominator,\n        }\n\n    return {\n        "profile": profile,\n        "status": "sufficient_basis" if all_sufficient else "collecting",\n        "minimum_samples_for_sufficient_basis": DAY_TYPE_DAYPART_MINIMUM_SAMPLES,\n        "observer_only": True,\n        "combinations": result,\n    }\n'''
          if 'def calculate_day_type_daypart_quality(' not in text:
              evaluation.write_text(text + addition)

          sensor = Path('custom_components/dummy_os_data/sensor.py')
          text = sensor.read_text()
          text = text.replace(
              'from .evaluation import calculate_day_type_quality, calculate_daypart_quality',
              'from .evaluation import calculate_day_type_daypart_quality, calculate_day_type_quality, calculate_daypart_quality',
          )
          text = text.replace(
              '            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n',
              '            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n            DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator),\n',
          )
          marker = '\n\nclass DummyOSWeatherCurrentSensor(DummyOSWeatherBaseSensor):'
          cls = '''\n\nclass DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(DummyOSBaseSensor):\n    """Observer-only Energy forecast quality by day type and daypart."""\n\n    _attr_name = "DO Energy Forecast Quality By Day Type And Daypart"\n    _attr_unique_id = "do_energy_forecast_quality_by_day_type_and_daypart"\n    _attr_suggested_object_id = "do_energy_forecast_quality_by_day_type_and_daypart"\n    _attr_icon = "mdi:calendar-clock"\n\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_day_type_daypart_quality(\n            self.coordinator.evaluations,\n            self.coordinator.records,\n            self.coordinator.profile,\n            dt_util.as_local,\n        )\n\n    @property\n    def native_value(self) -> str:\n        return str(self._quality["status"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        quality = self._quality\n        return {\n            "profile": quality["profile"],\n            "observer_only": True,\n            "resolution_minutes": 15,\n            "minimum_samples_for_sufficient_basis": quality["minimum_samples_for_sufficient_basis"],\n            "combination_basis": "local_quarter_start_day_type_and_daypart",\n            "combinations": quality["combinations"],\n        }\n'''
          if 'class DummyOSHomeForecastQualityByDayTypeAndDaypartSensor' not in text:
              text = text.replace(marker, cls + marker)
          sensor.write_text(text)

          migrations = Path('custom_components/dummy_os_data/entity_migrations.py')
          text = migrations.read_text()
          text = text.replace(
              '    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n}',
              '    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n    "do_energy_forecast_quality_by_day_type_and_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type_and_daypart",\n}',
          )
          migrations.write_text(text)

          init = Path('custom_components/dummy_os_data/__init__.py')
          text = init.read_text()
          text = text.replace(
              '    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n',
              '    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n    ("sensor", "do_energy_forecast_quality_by_day_type_and_daypart", "sensor.do_energy_forecast_quality_by_day_type_and_daypart"),\n',
          )
          init.write_text(text)

          consistency = Path('tests/test_release_consistency.py')
          text = consistency.read_text()
          text = text.replace(
              '    "do_energy_forecast_quality_by_day_type",\n)',
              '    "do_energy_forecast_quality_by_day_type",\n    "do_energy_forecast_quality_by_day_type_and_daypart",\n)',
          )
          text = text.replace('self.assertEqual(16, sum(', 'self.assertEqual(17, sum(')
          consistency.write_text(text)
          PY

      - name: Add Step 5 tests
        run: |
          cat > tests/test_energy_day_type_daypart_quality.py <<'PY'
          from __future__ import annotations

          import importlib.util
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location("energy_evaluation_step5", ROOT / "custom_components/dummy_os_data/evaluation.py")
          assert SPEC is not None and SPEC.loader is not None
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)
          calculate_quality = MODULE.calculate_day_type_daypart_quality

          LOCAL = ZoneInfo("Europe/Amsterdam")

          def iso(local_text: str) -> str:
              local = datetime.fromisoformat(local_text).replace(tzinfo=LOCAL)
              return local.astimezone(timezone.utc).isoformat()

          def evaluation(local_text: str, actual=0.1, forecast=0.1, profile="normal"):
              return {"start": iso(local_text), "profile": profile, "actual_kwh": actual, "forecast_kwh": forecast}

          def record(local_text: str, profile="normal", valid=True):
              return {"start": iso(local_text), "profile": profile, "valid": valid}

          def localize(value):
              return value.astimezone(LOCAL)

          def test_exact_eight_combination_keys_and_boundaries():
              times = [
                  "2026-09-04T05:45", "2026-09-04T06:00", "2026-09-04T12:00", "2026-09-04T18:00",
                  "2026-09-05T05:45", "2026-09-05T06:00", "2026-09-05T12:00", "2026-09-05T18:00",
              ]
              result = calculate_quality([evaluation(t) for t in times], [record(t) for t in times], "normal", localize)
              assert set(result["combinations"]) == {
                  "weekday_night", "weekday_morning", "weekday_afternoon", "weekday_evening",
                  "weekend_night", "weekend_morning", "weekend_afternoon", "weekend_evening",
              }
              assert all(item["sample_count"] == 1 for item in result["combinations"].values())

          def test_profile_separation_and_missing_not_zero():
              evaluations = [
                  evaluation("2026-09-07T12:00", 0.1, 0.2, "normal"),
                  evaluation("2026-09-07T12:15", 0.5, 0.5, "away"),
                  {"start": iso("2026-09-07T12:30"), "profile": "normal", "actual_kwh": None, "forecast_kwh": 0.2},
              ]
              records = [record("2026-09-07T12:00"), record("2026-09-07T12:30")]
              segment = calculate_quality(evaluations, records, "normal", localize)["combinations"]["weekday_afternoon"]
              assert segment["sample_count"] == 1
              assert segment["valid_actual_quarters"] == 2
              assert segment["evaluation_coverage_percent"] == 50.0
              assert segment["mae_kwh"] == 0.1
              assert segment["bias_kwh"] == 0.1

          def test_total_readiness_requires_all_eight_segments():
              evaluations = []
              records = []
              weekday_date = "2026-09-07"
              weekend_date = "2026-09-05"
              starts = [0, 6, 12, 18]
              for date in (weekday_date, weekend_date):
                  for hour in starts:
                      for index in range(32):
                          day_offset = index // 4
                          base = datetime.fromisoformat(f"{date}T{hour:02d}:00")
                          local = base.replace(tzinfo=LOCAL)
                          local = local.replace(day=local.day + day_offset, minute=(index % 4) * 15)
                          text = local.replace(tzinfo=None).isoformat(timespec="minutes")
                          evaluations.append(evaluation(text))
                          records.append(record(text))
              result = calculate_quality(evaluations, records, "normal", localize)
              assert result["status"] == "sufficient_basis"
              assert all(item["status"] == "sufficient_basis" for item in result["combinations"].values())

          def test_week_boundary_and_dst_use_local_calendar():
              times = ["2026-09-04T23:45", "2026-09-05T00:00", "2026-09-06T23:45", "2026-09-07T00:00"]
              result = calculate_quality([evaluation(t) for t in times], [record(t) for t in times], "normal", localize)
              assert result["combinations"]["weekday_evening"]["sample_count"] == 1
              assert result["combinations"]["weekend_night"]["sample_count"] == 1
              assert result["combinations"]["weekend_evening"]["sample_count"] == 1
              assert result["combinations"]["weekday_night"]["sample_count"] == 1
              dst = calculate_quality(
                  [evaluation("2026-03-29T03:00")], [record("2026-03-29T03:00")], "normal", localize
              )
              assert dst["combinations"]["weekend_night"]["sample_count"] == 1
          PY

          cat > tests/test_energy_day_type_daypart_sensor_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).parents[1]

          def test_exact_identity_and_observer_contract():
              sensor = (ROOT / "custom_components/dummy_os_data/sensor.py").read_text()
              init = (ROOT / "custom_components/dummy_os_data/__init__.py").read_text()
              migrations = (ROOT / "custom_components/dummy_os_data/entity_migrations.py").read_text()
              uid = "do_energy_forecast_quality_by_day_type_and_daypart"
              assert f'_attr_unique_id = "{uid}"' in sensor
              assert f'_attr_suggested_object_id = "{uid}"' in sensor
              assert "DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator)" in sensor
              assert f'("sensor", "{uid}", "sensor.{uid}")' in init
              assert f'"{uid}": "sensor.dummy_os_forecast_{uid}"' in migrations
              assert '"observer_only": True' in sensor

          def test_native_architecture_remains_15_72_288():
              const = (ROOT / "custom_components/dummy_os_data/const.py").read_text()
              assert "QUARTER_MINUTES = 15" in const
              assert "FORECAST_HORIZON_HOURS = 72" in const
              assert "FORECAST_SLOTS = FORECAST_HORIZON_HOURS * 60 // QUARTER_MINUTES" in const
          PY

      - run: python -m pytest -q tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Remove temporary workflow and bytecode
        run: |
          rm .github/workflows/apply-energy-step5.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit Step 5 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Energy Step 5 combined quality diagnostics'
          git push origin HEAD:energy-step5-day-type-daypart-quality
