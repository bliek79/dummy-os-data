name: Step 6D cleanup generated bytecode

on:
  push:
    branches: [step6d-peak-learning-observer]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'bootstrap step6d pyc cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step6d-peak-learning-observer
          fetch-depth: 0
      - name: Remove generated bytecode and temporary workflow
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/workflows/step6d-clean-pyc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated bytecode from Step 6D"
          git push origin HEAD:step6d-peak-learning-observer
