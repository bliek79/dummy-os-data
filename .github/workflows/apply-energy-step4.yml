name: Apply Energy Step 4 day type quality

on:
  push:
    branches:
      - energy-step4-day-type-quality
    paths:
      - .github/workflows/apply-energy-step4.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-step4-day-type-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Patch implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/dummy_os_data/evaluation.py'); t=p.read_text()
          if 'def calculate_day_type_quality(' not in t:
              t += '''\n\nDAY_TYPE_MINIMUM_SAMPLES = 32\nDAY_TYPES: tuple[str, str] = ("weekday", "weekend")\n\n\ndef _day_type_for_local_start(local_start) -> str:\n    return "weekend" if local_start.weekday() >= 5 else "weekday"\n\n\ndef calculate_day_type_quality(evaluations: list[dict[str, Any]], records: list[dict[str, Any]], profile: str, localize) -> dict[str, Any]:\n    """Observer-only forecast quality for weekday versus weekend."""\n    valid_actual_counts = {name: 0 for name in DAY_TYPES}\n    selected = {name: [] for name in DAY_TYPES}\n    for record in records:\n        if record.get("profile") != profile or record.get("valid") is not True:\n            continue\n        start = _parse_aware_start(record.get("start"))\n        if start is None:\n            continue\n        valid_actual_counts[_day_type_for_local_start(localize(start))] += 1\n    for item in evaluations:\n        if item.get("profile") != profile:\n            continue\n        start = _parse_aware_start(item.get("start"))\n        if start is None:\n            continue\n        try:\n            float(item["actual_kwh"]); float(item["forecast_kwh"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        selected[_day_type_for_local_start(localize(start))].append(item)\n    result = {}\n    all_sufficient = True\n    for name in DAY_TYPES:\n        metrics = calculate_metrics(selected[name], profile=None)\n        samples = int(metrics["samples"]); denominator = valid_actual_counts[name]\n        coverage = round(min(100.0, samples / denominator * 100.0), 1) if denominator > 0 else None\n        status = "sufficient_basis" if samples >= DAY_TYPE_MINIMUM_SAMPLES else "collecting"\n        all_sufficient = all_sufficient and status == "sufficient_basis"\n        result[name] = {"status": status, "sample_count": samples, "mae_kwh": metrics["mae_kwh"], "bias_kwh": metrics["bias_kwh"], "evaluation_coverage_percent": coverage, "accuracy_percent": metrics["accuracy_percent"], "valid_actual_quarters": denominator}\n    return {"profile": profile, "status": "sufficient_basis" if all_sufficient else "collecting", "minimum_samples_for_sufficient_basis": DAY_TYPE_MINIMUM_SAMPLES, "observer_only": True, "day_types": result}\n'''
              p.write_text(t)
          p=Path('custom_components/dummy_os_data/sensor.py'); t=p.read_text()
          t=t.replace('from .evaluation import calculate_daypart_quality','from .evaluation import calculate_day_type_quality, calculate_daypart_quality')
          t=t.replace('            DummyOSHomeForecastQualityByDaypartSensor(coordinator),\n','            DummyOSHomeForecastQualityByDaypartSensor(coordinator),\n            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n')
          marker='\n\nclass DummyOSWeatherCurrentSensor(DummyOSWeatherBaseSensor):'
          cls='''\n\nclass DummyOSHomeForecastQualityByDayTypeSensor(DummyOSBaseSensor):\n    """Observer-only Energy forecast quality split by weekday and weekend."""\n    _attr_name = "DO Energy Forecast Quality By Day Type"\n    _attr_unique_id = "do_energy_forecast_quality_by_day_type"\n    _attr_suggested_object_id = "do_energy_forecast_quality_by_day_type"\n    _attr_icon = "mdi:calendar-week"\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_day_type_quality(self.coordinator.evaluations, self.coordinator.records, self.coordinator.profile, dt_util.as_local)\n    @property\n    def native_value(self) -> str:\n        return str(self._quality["status"])\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        quality = self._quality\n        return {"profile": quality["profile"], "observer_only": True, "resolution_minutes": 15, "minimum_samples_for_sufficient_basis": quality["minimum_samples_for_sufficient_basis"], "day_type_basis": "local_quarter_start_weekday_weekend", "day_types": quality["day_types"]}\n'''
          if 'class DummyOSHomeForecastQualityByDayTypeSensor' not in t: t=t.replace(marker,cls+marker)
          p.write_text(t)
          p=Path('custom_components/dummy_os_data/entity_migrations.py'); t=p.read_text(); t=t.replace('    "do_energy_forecast_quality_by_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart",\n}','    "do_energy_forecast_quality_by_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart",\n    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n}'); p.write_text(t)
          p=Path('custom_components/dummy_os_data/__init__.py'); t=p.read_text(); t=t.replace('    ("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart"),\n','    ("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart"),\n    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n'); p.write_text(t)
          p=Path('tests/test_release_consistency.py'); t=p.read_text(); t=t.replace('    "do_energy_forecast_quality_by_daypart",\n)','    "do_energy_forecast_quality_by_daypart",\n    "do_energy_forecast_quality_by_day_type",\n)').replace('self.assertEqual(15, sum(','self.assertEqual(16, sum('); p.write_text(t)
          PY
      - name: Add tests
        run: |
          cat > tests/test_energy_day_type_quality.py <<'PY'
          from __future__ import annotations
          import importlib.util
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          ROOT=Path(__file__).resolve().parents[1]
          SPEC=importlib.util.spec_from_file_location('energy_evaluation_day_type',ROOT/'custom_components/dummy_os_data/evaluation.py')
          assert SPEC and SPEC.loader
          MODULE=importlib.util.module_from_spec(SPEC); SPEC.loader.exec_module(MODULE)
          calculate_day_type_quality=MODULE.calculate_day_type_quality
          LOCAL=ZoneInfo('Europe/Amsterdam')
          def iso(s): return datetime.fromisoformat(s).replace(tzinfo=LOCAL).astimezone(timezone.utc).isoformat()
          def ev(s,a=.1,f=.1,p='normal'): return {'start':iso(s),'profile':p,'actual_kwh':a,'forecast_kwh':f}
          def rec(s,p='normal',v=True): return {'start':iso(s),'profile':p,'valid':v}
          def loc(v): return v.astimezone(LOCAL)
          def test_boundaries():
              ts=['2026-09-04T23:45','2026-09-05T00:00','2026-09-06T23:45','2026-09-07T00:00']; r=calculate_day_type_quality([ev(x) for x in ts],[rec(x) for x in ts],'normal',loc)
              assert r['day_types']['weekday']['sample_count']==2 and r['day_types']['weekend']['sample_count']==2
              assert r['day_types']['weekday']['evaluation_coverage_percent']==100.0 and r['day_types']['weekend']['evaluation_coverage_percent']==100.0
          def test_profile_missing_and_metrics():
              e=[ev('2026-09-07T10:00',.1,.2),ev('2026-09-07T10:15',.5,.5,'away'),{'start':iso('2026-09-07T10:30'),'profile':'normal','actual_kwh':None,'forecast_kwh':.2}]
              r=calculate_day_type_quality(e,[rec('2026-09-07T10:00'),rec('2026-09-07T10:30')],'normal',loc)['day_types']['weekday']
              assert r['sample_count']==1 and r['valid_actual_quarters']==2 and r['evaluation_coverage_percent']==50.0 and r['mae_kwh']==0.1 and r['bias_kwh']==0.1
          def test_readiness():
              e=[]; rr=[]
              for i in range(32):
                  w=f'2026-09-07T{(i//4):02d}:{(i%4)*15:02d}'; z=f'2026-09-05T{(i//4):02d}:{(i%4)*15:02d}'; e += [ev(w),ev(z)]; rr += [rec(w),rec(z)]
              assert calculate_day_type_quality(e,rr,'normal',loc)['status']=='sufficient_basis'
          def test_dst_calendar_classification():
              r=calculate_day_type_quality([ev('2026-03-29T03:00'),ev('2026-03-30T00:00')],[rec('2026-03-29T03:00'),rec('2026-03-30T00:00')],'normal',loc)
              assert r['day_types']['weekend']['sample_count']==1 and r['day_types']['weekday']['sample_count']==1
          PY
          cat > tests/test_energy_day_type_sensor_contract.py <<'PY'
          from pathlib import Path
          ROOT=Path(__file__).parents[1]
          def test_identity():
              s=(ROOT/'custom_components/dummy_os_data/sensor.py').read_text(); i=(ROOT/'custom_components/dummy_os_data/__init__.py').read_text(); m=(ROOT/'custom_components/dummy_os_data/entity_migrations.py').read_text(); u='do_energy_forecast_quality_by_day_type'
              assert f'_attr_unique_id = "{u}"' in s and f'_attr_suggested_object_id = "{u}"' in s and f'("sensor", "{u}", "sensor.{u}")' in i and f'"{u}": "sensor.dummy_os_forecast_{u}"' in m
          def test_architecture():
              c=(ROOT/'custom_components/dummy_os_data/const.py').read_text(); f=(ROOT/'custom_components/dummy_os_data/forecast.py').read_text()
              assert 'QUARTER_MINUTES = 15' in c and 'FORECAST_HORIZON_HOURS = 72' in c and 'FORECAST_SLOTS = 288' in c and 'return "weekend" if local_dt.weekday() >= 5 else "weekday"' in f
          PY
      - run: python -m compileall -q custom_components/dummy_os_data
      - run: python -m pytest -q tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - run: rm .github/workflows/apply-energy-step4.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Energy Step 4 day type quality diagnostics'
          git push origin HEAD:energy-step4-day-type-quality
