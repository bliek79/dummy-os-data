name: Apply Energy Step 4 day type quality

on:
  push:
    branches:
      - energy-step4-day-type-quality
    paths:
      - .github/workflows/apply-energy-step4.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: energy-step4-day-type-quality

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Patch Step 4 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluation = Path('custom_components/dummy_os_data/evaluation.py')
          text = evaluation.read_text()
          addition = '''\n\nDAY_TYPE_MINIMUM_SAMPLES = 32\nDAY_TYPES: tuple[str, str] = ("weekday", "weekend")\n\n\ndef _day_type_for_local_start(local_start) -> str:\n    """Return the existing forecast day type for a local quarter start."""\n    return "weekend" if local_start.weekday() >= 5 else "weekday"\n\n\ndef calculate_day_type_quality(\n    evaluations: list[dict[str, Any]],\n    records: list[dict[str, Any]],\n    profile: str,\n    localize,\n) -> dict[str, Any]:\n    """Calculate observer-only forecast quality for weekday versus weekend."""\n    valid_actual_counts = {name: 0 for name in DAY_TYPES}\n    selected = {name: [] for name in DAY_TYPES}\n    for record in records:\n        if record.get("profile") != profile or record.get("valid") is not True:\n            continue\n        start = _parse_aware_start(record.get("start"))\n        if start is None:\n            continue\n        valid_actual_counts[_day_type_for_local_start(localize(start))] += 1\n    for item in evaluations:\n        if item.get("profile") != profile:\n            continue\n        start = _parse_aware_start(item.get("start"))\n        if start is None:\n            continue\n        try:\n            float(item["actual_kwh"]); float(item["forecast_kwh"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        selected[_day_type_for_local_start(localize(start))].append(item)\n    result = {}\n    all_sufficient = True\n    for name in DAY_TYPES:\n        metrics = calculate_metrics(selected[name], profile=None)\n        samples = int(metrics["samples"]); denominator = valid_actual_counts[name]\n        coverage = round(min(100.0, samples / denominator * 100.0), 1) if denominator > 0 else None\n        status = "sufficient_basis" if samples >= DAY_TYPE_MINIMUM_SAMPLES else "collecting"\n        all_sufficient = all_sufficient and status == "sufficient_basis"\n        result[name] = {"status": status, "sample_count": samples, "mae_kwh": metrics["mae_kwh"], "bias_kwh": metrics["bias_kwh"], "evaluation_coverage_percent": coverage, "accuracy_percent": metrics["accuracy_percent"], "valid_actual_quarters": denominator}\n    return {"profile": profile, "status": "sufficient_basis" if all_sufficient else "collecting", "minimum_samples_for_sufficient_basis": DAY_TYPE_MINIMUM_SAMPLES, "observer_only": True, "day_types": result}\n'''
          if 'def calculate_day_type_quality(' not in text:
              evaluation.write_text(text + addition)

          sensor = Path('custom_components/dummy_os_data/sensor.py')
          text = sensor.read_text().replace('from .evaluation import calculate_daypart_quality','from .evaluation import calculate_day_type_quality, calculate_daypart_quality')
          text = text.replace('            DummyOSHomeForecastQualityByDaypartSensor(coordinator),\n','            DummyOSHomeForecastQualityByDaypartSensor(coordinator),\n            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n')
          marker='\n\nclass DummyOSWeatherCurrentSensor(DummyOSWeatherBaseSensor):'
          cls='''\n\nclass DummyOSHomeForecastQualityByDayTypeSensor(DummyOSBaseSensor):\n    """Observer-only Energy forecast quality split by weekday and weekend."""\n    _attr_name = "DO Energy Forecast Quality By Day Type"\n    _attr_unique_id = "do_energy_forecast_quality_by_day_type"\n    _attr_suggested_object_id = "do_energy_forecast_quality_by_day_type"\n    _attr_icon = "mdi:calendar-week"\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_day_type_quality(self.coordinator.evaluations, self.coordinator.records, self.coordinator.profile, dt_util.as_local)\n    @property\n    def native_value(self) -> str:\n        return str(self._quality["status"])\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        quality = self._quality\n        return {"profile": quality["profile"], "observer_only": True, "resolution_minutes": 15, "minimum_samples_for_sufficient_basis": quality["minimum_samples_for_sufficient_basis"], "day_type_basis": "local_quarter_start_weekday_weekend", "day_types": quality["day_types"]}\n'''
          if 'class DummyOSHomeForecastQualityByDayTypeSensor' not in text:
              text=text.replace(marker,cls+marker)
          sensor.write_text(text)

          migrations=Path('custom_components/dummy_os_data/entity_migrations.py')
          text=migrations.read_text().replace('    "do_energy_forecast_quality_by_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart",\n}','    "do_energy_forecast_quality_by_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_daypart",\n    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n}')
          migrations.write_text(text)

          init=Path('custom_components/dummy_os_data/__init__.py')
          text=init.read_text().replace('    ("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart"),\n','    ("sensor", "do_energy_forecast_quality_by_daypart", "sensor.do_energy_forecast_quality_by_daypart"),\n    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n')
          init.write_text(text)

          consistency=Path('tests/test_release_consistency.py')
          text=consistency.read_text().replace('    "do_energy_forecast_quality_by_daypart",\n)','    "do_energy_forecast_quality_by_daypart",\n    "do_energy_forecast_quality_by_day_type",\n)').replace('self.assertEqual(15, sum(','self.assertEqual(16, sum(')
          consistency.write_text(text)
          PY

      - name: Add Step 4 tests
        run: |
          cat > tests/test_energy_day_type_quality.py <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from custom_components.dummy_os_data.evaluation import calculate_day_type_quality
          LOCAL = ZoneInfo("Europe/Amsterdam")
          def utc_iso(local_text): return datetime.fromisoformat(local_text).replace(tzinfo=LOCAL).astimezone(timezone.utc).isoformat()
          def evaluation(local_text, actual, forecast, profile="normal"): return {"start": utc_iso(local_text), "profile": profile, "actual_kwh": actual, "forecast_kwh": forecast}
          def record(local_text, profile="normal", valid=True): return {"start": utc_iso(local_text), "profile": profile, "valid": valid, "energy_kwh": 0.1}
          def localize(value): return value.astimezone(LOCAL)
          def test_boundaries_and_metrics():
              times=["2026-09-04T23:45:00","2026-09-05T00:00:00","2026-09-06T23:45:00","2026-09-07T00:00:00"]
              ev=[evaluation(times[0],.1,.12),evaluation(times[1],.2,.18),evaluation(times[2],.3,.33),evaluation(times[3],.4,.35)]
              result=calculate_day_type_quality(ev,[record(t) for t in times],"normal",localize)
              assert result["day_types"]["weekday"]["sample_count"]==2
              assert result["day_types"]["weekend"]["sample_count"]==2
              assert result["day_types"]["weekday"]["evaluation_coverage_percent"]==100.0
              assert result["day_types"]["weekend"]["evaluation_coverage_percent"]==100.0
          def test_profile_separation_missing_not_zero():
              ev=[evaluation("2026-09-07T10:00:00",.1,.2),evaluation("2026-09-07T10:15:00",.5,.5,"away"),{"start":utc_iso("2026-09-07T10:30:00"),"profile":"normal","actual_kwh":None,"forecast_kwh":.2}]
              r=calculate_day_type_quality(ev,[record("2026-09-07T10:00:00"),record("2026-09-07T10:30:00")],"normal",localize)["day_types"]["weekday"]
              assert r["sample_count"]==1 and r["valid_actual_quarters"]==2 and r["evaluation_coverage_percent"]==50.0
              assert r["mae_kwh"]==0.1 and r["bias_kwh"]==0.1
          def test_readiness_requires_both_segments():
              ev=[]; records=[]
              for i in range(32):
                  w=f"2026-09-07T{(i//4):02d}:{(i%4)*15:02d}:00"; e=f"2026-09-05T{(i//4):02d}:{(i%4)*15:02d}:00"
                  ev += [evaluation(w,.1,.1),evaluation(e,.1,.1)]; records += [record(w),record(e)]
              result=calculate_day_type_quality(ev,records,"normal",localize)
              assert result["status"]=="sufficient_basis"
          def test_dst_classification():
              ev=[evaluation("2026-03-29T03:00:00",.1,.1),evaluation("2026-03-30T00:00:00",.1,.1)]
              result=calculate_day_type_quality(ev,[record("2026-03-29T03:00:00"),record("2026-03-30T00:00:00")],"normal",localize)
              assert result["day_types"]["weekend"]["sample_count"]==1 and result["day_types"]["weekday"]["sample_count"]==1
          PY
          cat > tests/test_energy_day_type_sensor_contract.py <<'PY'
          from pathlib import Path
          ROOT=Path(__file__).parents[1]
          def test_identity_contract():
              sensor=(ROOT/'custom_components/dummy_os_data/sensor.py').read_text(); init=(ROOT/'custom_components/dummy_os_data/__init__.py').read_text(); migrations=(ROOT/'custom_components/dummy_os_data/entity_migrations.py').read_text(); uid='do_energy_forecast_quality_by_day_type'
              assert f'_attr_unique_id = "{uid}"' in sensor and f'_attr_suggested_object_id = "{uid}"' in sensor
              assert f'("sensor", "{uid}", "sensor.{uid}")' in init
              assert f'"{uid}": "sensor.dummy_os_forecast_{uid}"' in migrations
          def test_native_architecture_unchanged():
              const=(ROOT/'custom_components/dummy_os_data/const.py').read_text(); forecast=(ROOT/'custom_components/dummy_os_data/forecast.py').read_text()
              assert 'QUARTER_MINUTES = 15' in const and 'FORECAST_HORIZON_HOURS = 72' in const and 'FORECAST_SLOTS = 288' in const
              assert 'return "weekend" if local_dt.weekday() >= 5 else "weekday"' in forecast
          PY

      - name: Compile integration
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run Step 4 and regression tests
        run: python -m pytest -q tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-energy-step4.yml
      - name: Commit Step 4 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Energy Step 4 day type quality diagnostics'
          git push origin HEAD:energy-step4-day-type-quality
