name: Step 6D Peak Learning implementation

on:
  push:
    branches: [step6d-peak-learning-observer]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'bootstrap step6d implementation v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step6d-peak-learning-observer
          fetch-depth: 0
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply implementation
        run: |
          python tools/step6d_apply.py
          python tools/step6d_testfix.py
      - name: Compile
        run: python -m compileall custom_components/dummy_os_data
      - name: Validate manifest
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Test
        run: pytest -q
      - name: Commit
        run: |
          rm -f tools/step6d_apply.py tools/step6d_testfix.py .github/workflows/step6d-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Step 6D observer-only peak learning"
          git push origin HEAD:step6d-peak-learning-observer
