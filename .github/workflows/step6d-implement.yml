          manifest.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')

          test = Path('tests/test_peak_learning.py')
          test.write_text(r'''from datetime import datetime, timedelta, timezone

from custom_components.dummy_os_data.evaluation import calculate_peak_learning


def _localize(value):
    return value


def _row(start, forecast, actual, profile="normal", coverage=1.0):
    return {
        "start": start.isoformat(),
        "end": (start + timedelta(minutes=15)).isoformat(),
        "profile": profile,
        "forecast_kwh": forecast,
        "actual_kwh": actual,
        "actual_coverage": coverage,
    }


def _basis(days=12, hour=17, peak_minute=15):
    rows = []
    origin = datetime(2026, 8, 1, tzinfo=timezone.utc)
    for day in range(days):
        for minute in (0, 15, 30, 45):
            start = origin + timedelta(days=day, hours=hour, minutes=minute)
            actual = 0.10
            if minute == peak_minute and day % 2 == 0:
                actual = 0.55
            rows.append(_row(start, 0.10, actual))
    return rows


def test_collecting_does_not_turn_missing_threshold_into_zero():
    result = calculate_peak_learning(_basis(days=2), "normal", _localize)
    assert result["status"] == "collecting"
    assert result["calibration"]["hour_17"]["threshold_kwh"] is None
    assert result["forecast_influence_enabled"] is False


def test_minimum_basis_requires_32_quarters_and_8_distinct_days():
    result = calculate_peak_learning(_basis(days=8), "normal", _localize)
    assert result["calibration"]["hour_17"]["sample_count"] == 32
    assert result["calibration"]["hour_17"]["distinct_days"] == 8
    assert result["calibration"]["hour_17"]["status"] == "calibrated"


def test_profile_separation():
    rows = _basis(days=8) + [_row(datetime(2026, 9, 1, 17, tzinfo=timezone.utc), 0.1, 5.0, profile="away")]
    result = calculate_peak_learning(rows, "normal", _localize)
    assert result["calibration"]["hour_17"]["sample_count"] == 32


def test_adjacent_candidates_merge_but_gap_does_not():
    rows = _basis(days=10, peak_minute=15)
    origin = datetime(2026, 8, 11, 17, tzinfo=timezone.utc)
    for minute in (0, 15, 45):
        rows.append(_row(origin.replace(minute=minute), 0.1, 1.0))
    result = calculate_peak_learning(rows, "normal", _localize)
    day_events = [event for event in result["events"] if event["local_date"] == "2026-08-11"]
    assert any(event["quarter_count"] == 2 for event in day_events)
    assert any(event["quarter_count"] == 1 for event in day_events)


def test_event_may_cross_hour_boundary():
    rows = []
    origin = datetime(2026, 8, 1, tzinfo=timezone.utc)
    for day in range(10):
        for hour in (16, 17):
            for minute in (0, 15, 30, 45):
                actual = 0.1
                if day % 2 == 0 and ((hour, minute) in {(16, 45), (17, 0)}):
                    actual = 0.9
                rows.append(_row(origin + timedelta(days=day, hours=hour, minutes=minute), 0.1, actual))
    result = calculate_peak_learning(rows, "normal", _localize)
    assert any(event["quarter_count"] >= 2 for event in result["events"])


def test_1700_window_never_becomes_exact_quarter_structural():
    result = calculate_peak_learning(_basis(days=12), "normal", _localize)
    cls = result["classifications"]["hour_17"]["classification"]
    assert cls != "structural"
    assert result["protected_windows"]["17:00-18:00"]["policy"] == "no_exact_quarter_structural"


def test_native_forecast_constants_unchanged():
    from custom_components.dummy_os_data.const import FORECAST_HORIZON_HOURS, FORECAST_SLOTS, QUARTER_MINUTES
    assert QUARTER_MINUTES == 15
    assert FORECAST_HORIZON_HOURS == 72
    assert FORECAST_SLOTS == 288
''')

