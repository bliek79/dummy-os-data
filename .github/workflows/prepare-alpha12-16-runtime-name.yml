name: Prepare Dummy OS Forecast alpha.12.16 runtime name

on:
  push:
    branches:
      - fix-observer-runtime-friendly-name
    paths:
      - .github/workflows/prepare-alpha12-16-runtime-name.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-observer-runtime-friendly-name
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime name fix
        run: python scripts/apply_alpha12_16_runtime_name_fix.py
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Verify observer runtime names
        run: |
          grep -F 'return "DO Energy Time Windows"' custom_components/dummy_os_data/sensor.py
          grep -F 'return "DO Energy Peak Learning"' custom_components/dummy_os_data/sensor.py
          grep -F 'VERSION = "0.1.0-alpha.12.16"' custom_components/dummy_os_data/const.py
      - name: Commit prepared hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize alpha.12.16 observer runtime name fix'
          git push origin HEAD:fix-observer-runtime-friendly-name
