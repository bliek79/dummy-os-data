name: Alpha35 integration gate
on:
  push:
    branches: [alpha35-shared-time-contract]
    paths: [.github/workflows/alpha35-apply.yml, .alpha35_apply.py]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha35-shared-time-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Apply reviewed adapters
        run: |
          git merge-base --is-ancestor fa9d962d8ff738d3195c7c7735d87f81f6234f42 HEAD
          python .alpha35_apply.py
      - name: Full regression gate
        run: |
          python -m compileall -q custom_components/dummy_os_data tests
          set -o pipefail
          python -m pytest -q | tee /tmp/alpha35-full-tests.txt
          python -m pytest -q tests/test_alpha35_shared_time_contract.py tests/test_alpha34_sequential_safety.py tests/test_alpha33_reserve_safety_hourly_fix.py tests/test_alpha32_native_planner_parity.py tests/test_alpha31_resilient_planner.py tests/test_alpha30_startup_performance.py tests/test_alpha29_price_buffer.py | tee /tmp/alpha35-focused-tests.txt
      - name: Commit only validated runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests
          git diff --cached --check
          git commit -m 'Alpha35: enforce shared UTC quarter window and explicit hourly coverage'
          git push origin HEAD:alpha35-shared-time-contract
      - name: Capture exact tested tree and logs
        if: always()
        run: |
          mkdir -p /tmp/alpha35-validation
          git rev-parse HEAD > /tmp/alpha35-validation/source-sha.txt
          git diff > /tmp/alpha35-validation/uncommitted.patch
          tar --exclude=.git --exclude=__pycache__ --exclude=.pytest_cache -czf /tmp/alpha35-validation/source.tar.gz .
          cp /tmp/alpha35-*-tests.txt /tmp/alpha35-validation/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha35-validated-source
          path: /tmp/alpha35-validation/*
          retention-days: 2
