name: Prepare alpha.12.11
on:
  push:
    branches: [release-alpha12-11]
    paths: [.github/workflows/prepare-alpha12-11.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-alpha12-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Update release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          version='0.1.0-alpha.12.11'
          p=Path('custom_components/dummy_os_data/const.py')
          s=p.read_text().replace('VERSION = "0.1.0-alpha.12.10"', f'VERSION = "{version}"')
          p.write_text(s)
          p=Path('custom_components/dummy_os_data/manifest.json')
          d=json.loads(p.read_text()); d['version']=version; p.write_text(json.dumps(d, indent=2)+"\n")
          p=Path('tests/test_release_consistency.py')
          s=p.read_text().replace('VERSION = "0.1.0-alpha.12.10"', f'VERSION = "{version}"')
          p.write_text(s)
          Path('RELEASE_NOTES.md').write_text('''# GitHub Release

**Tag:** `0.1.0-alpha.12.11`

**Release title:** `Dummy OS Forecast 0.1.0-alpha.12.11 - Energy Hourly Quality Diagnostic`

## Dummy OS Forecast 0.1.0-alpha.12.11

Gerichte observer-only uitbreiding om de zwakke middagforecast per afzonderlijk lokaal uur te analyseren.

### Toegevoegd / verbeterd
- Nieuwe canonieke sensor `sensor.do_energy_forecast_quality_by_hour`.
- Exacte `unique_id` en `suggested_object_id`: `do_energy_forecast_quality_by_hour`.
- Uitsplitsing van de middag in zes lokale uren: 12:00-13:00, 13:00-14:00, 14:00-15:00, 15:00-16:00, 16:00-17:00 en 17:00-18:00.
- Per uur: sample count, MAE, bias, evaluation coverage, accuracy en geldige actual-kwartieren.
- Indeling op lokale kwartierstart en strikt per actief profiel.
- Minimum 32 geldige forward-looking evaluatiepunten per uur voor `sufficient_basis`; totaalstatus pas voldoende als alle zes uren voldoende basis hebben.
- Onbekende, ontbrekende of ongeldige waarden worden nooit als nul gereconstrueerd.
- Deterministische migratie van de bekende automatisch gegenereerde alias-ID naar de canonieke entity-ID.

### Ongewijzigd
- Observer-only: geen wijziging aan forecastwaarden, modeltraining, fallback, recency weighting, confidence of EMS-sturing.
- Native architectuur blijft 15 minuten / 72 uur / 288 slots.
- Bestaande dagdeel-, dagtype- en gecombineerde kwaliteitsdiagnostiek blijven ongewijzigd.

### Live validatie na installatie
1. Controleer dat `sensor.do_energy_forecast_quality_by_hour` exact verschijnt.
2. Controleer `observer_only: true`, profiel en resolutie 15 minuten.
3. Controleer exact zes middaguren van 12:00 tot 18:00.
4. Vergelijk MAE, bias en accuracy per uur en bepaal het sterkst afwijkende uur.
5. Controleer coverage, sample count en valid actual quarters per uur.
6. Bevestig dat bestaande Energy Forecast-sensoren en 288-slot forecast ongewijzigd blijven functioneren.
''')
          PY
      - name: Test
        run: |
          python -m pytest -q tests/test_energy_hour_quality.py tests/test_energy_hour_sensor_contract.py tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
          python -m compileall -q custom_components/dummy_os_data
      - name: Commit prepared release
        run: |
          rm .github/workflows/prepare-alpha12-11.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_release_consistency.py RELEASE_NOTES.md .github/workflows/prepare-alpha12-11.yml
          git commit -m 'Prepare 0.1.0-alpha.12.11 release'
          git push origin HEAD:release-alpha12-11
