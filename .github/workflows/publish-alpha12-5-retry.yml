name: Retry Dummy OS Forecast alpha.12.5 publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha12-5-retry.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse targeted alpha.12.5 patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/publish-alpha12-5.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Apply targeted Solar horizon hotfix')
          run_line = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end]) + '\n'
          exec(compile(script, str(path), 'exec'), {})

      - name: Validate
        run: |
          python -m compileall custom_components/dummy_os_data
          python -m pip install pytest
          python -m pytest -q

      - name: Commit and push hotfix
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests RELEASE_NOTES.md
          git commit -m "Fix Solar horizon runtime and canonical IDs for alpha.12.5"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        run: |
          zip -r Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip custom_components/dummy_os_data >/dev/null
          sha256sum Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip | tee SHA256SUMS-alpha12.5.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag 0.1.0-alpha.12.5 "${{ steps.commit.outputs.sha }}"
          git push origin 0.1.0-alpha.12.5
          gh release create 0.1.0-alpha.12.5 --title "Dummy OS Forecast 0.1.0-alpha.12.5 - Solar Horizon Runtime & Identity Hotfix" --notes-file RELEASE_NOTES.md --prerelease Dummy_OS_Forecast_0.1.0-alpha.12.5_HA_install.zip SHA256SUMS-alpha12.5.txt

      - name: Cleanup temporary workflows
        if: success()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/publish-alpha12-5.yml .github/workflows/publish-alpha12-5-retry.yml
          git commit -m "Remove temporary alpha.12.5 publish workflows"
          git push origin main
