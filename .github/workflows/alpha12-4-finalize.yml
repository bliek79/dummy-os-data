name: Finalize alpha 12.4 branding

on:
  push:
    branches:
      - feature/alpha12-4-shared-brand-icon

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize alpha.12.4 branding metadata'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/alpha12-4-shared-brand-icon
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_release_consistency.py')
          t = p.read_text()
          t = t.replace('alpha.12.3 naming/registry consistency checks', 'alpha.12.4 naming/registry consistency checks')
          t = t.replace('VERSION = "0.1.0-alpha.12.3"', 'VERSION = "0.1.0-alpha.12.4"')
          p.write_text(t)
          Path('RELEASE_NOTES.md').write_text('''# GitHub Release\n\n**Tag:** `0.1.0-alpha.12.4`\n\n**Release title:** `Dummy OS Forecast 0.1.0-alpha.12.4 - Shared Dummy OS Brand Icon`\n\n## Dummy OS Forecast 0.1.0-alpha.12.4\n\nDeze pre-release is uitsluitend een branding-update. Dummy OS Forecast gebruikt vanaf deze versie exact hetzelfde integratie-icoon als Dummy OS EMS.\n\n### Wijziging\n\n- toegevoegd: `custom_components/dummy_os_data/brand/icon.png`;\n- het bestand is byte-voor-byte gelijk aan `custom_components/anker_ems/brand/icon.png` uit Dummy OS EMS;\n- geen aparte Forecast-variant: bewust gedeelde Dummy OS-branding.\n\n### Ongewijzigd\n\n- Integratienaam: **Dummy OS Forecast**.\n- Technisch domain: `dummy_os_data`.\n- Source, Energy, Solar, Weather, Degree Days en Prices zijn functioneel ongewijzigd.\n- De Degree Days cleanup uit alpha.12.3 blijft ongewijzigd aanwezig.\n- Native architectuur blijft **15 minuten / 72 uur / 288 slots**.\n- Geen forecastmodel, berekening, migratie, entity-ID of fysieke EMS-sturing is gewijzigd.\n\n### Controle na installatie\n\n1. Controleer dat versie `0.1.0-alpha.12.4` draait onder **Dummy OS Forecast**.\n2. Controleer dat het Dummy OS-icoon zichtbaar wordt bij de integratie. Home Assistant/HACS kan branding cachen; een volledige herstart en eventueel verversen van de frontend kan nodig zijn.\n3. Controleer de Degree Days-set nogmaals na de alpha.12.3 cleanup: alleen de canonieke `sensor.do_degree_days_*` entiteiten horen over te blijven.\n''')
          PY
      - name: Verify shared icon is exact
        run: |
          curl -fL https://raw.githubusercontent.com/bliek79/dummy-os-anker-ems/main/custom_components/anker_ems/brand/icon.png -o /tmp/ems-icon.png
          cmp /tmp/ems-icon.png custom_components/dummy_os_data/brand/icon.png
          sha256sum /tmp/ems-icon.png custom_components/dummy_os_data/brand/icon.png
      - name: Validate
        run: |
          python -m compileall -q custom_components/dummy_os_data
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_NOTES.md tests/test_release_consistency.py
          git commit -m 'Finalize alpha.12.4 branding metadata'
          git push origin HEAD:feature/alpha12-4-shared-brand-icon
