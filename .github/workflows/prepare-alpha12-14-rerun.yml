name: Prepare corrected Dummy OS Forecast alpha.12.14

on:
  push:
    branches:
      - step7d-time-windows-observer
    paths:
      - .github/workflows/prepare-alpha12-14-rerun.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step7d-time-windows-observer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct instability fixture generator
        run: python scripts/fix_alpha12_14_unstable_test.py
      - name: Apply Step 7D release patch
        run: python scripts/prepare_alpha12_14.py
      - run: python -m pip install --upgrade pytest
      - name: Compile sources
        run: python -m compileall -q custom_components/dummy_os_data
      - name: Run full tests
        run: python -m pytest -q
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/dummy_os_data/manifest.json >/dev/null
      - name: Commit prepared release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/dummy_os_data/sensor.py custom_components/dummy_os_data/time_windows.py custom_components/dummy_os_data/const.py custom_components/dummy_os_data/manifest.json tests/test_time_windows.py tests/test_release_consistency.py RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize alpha.12.14 Energy Time Windows observer'
          git push origin HEAD:step7d-time-windows-observer
