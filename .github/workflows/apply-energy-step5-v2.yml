name: Apply Energy Step 5 combined quality v2

on:
  push:
    branches:
      - energy-step5-day-type-daypart-quality
    paths:
      - .github/workflows/apply-energy-step5-v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-step5-day-type-daypart-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - name: Patch implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/dummy_os_data/evaluation.py'); t=p.read_text()
          if 'def calculate_day_type_daypart_quality(' not in t:
              t += '''\n\nDAY_TYPE_DAYPART_MINIMUM_SAMPLES = 32\nDAY_TYPE_DAYPART_KEYS: tuple[str, ...] = tuple(f"{day_type}_{daypart}" for day_type in DAY_TYPES for daypart, _, _ in DAYPARTS)\n\ndef calculate_day_type_daypart_quality(evaluations: list[dict[str, Any]], records: list[dict[str, Any]], profile: str, localize) -> dict[str, Any]:\n    """Calculate observer-only Energy quality per day-type/daypart combination."""\n    valid_actual_counts = {key: 0 for key in DAY_TYPE_DAYPART_KEYS}\n    selected = {key: [] for key in DAY_TYPE_DAYPART_KEYS}\n    for record in records:\n        if record.get("profile") != profile or record.get("valid") is not True: continue\n        start = _parse_aware_start(record.get("start"))\n        if start is None: continue\n        local_start = localize(start); key = f"{_day_type_for_local_start(local_start)}_{_daypart_for_local_start(local_start)}"\n        valid_actual_counts[key] += 1\n    for item in evaluations:\n        if item.get("profile") != profile: continue\n        start = _parse_aware_start(item.get("start"))\n        if start is None: continue\n        try: float(item["actual_kwh"]); float(item["forecast_kwh"])\n        except (KeyError, TypeError, ValueError): continue\n        local_start = localize(start); key = f"{_day_type_for_local_start(local_start)}_{_daypart_for_local_start(local_start)}"\n        selected[key].append(item)\n    result = {}; all_sufficient = True\n    for key in DAY_TYPE_DAYPART_KEYS:\n        metrics = calculate_metrics(selected[key], profile=None); samples = int(metrics["samples"]); denominator = valid_actual_counts[key]\n        coverage = round(min(100.0, samples / denominator * 100.0), 1) if denominator > 0 else None\n        status = "sufficient_basis" if samples >= DAY_TYPE_DAYPART_MINIMUM_SAMPLES else "collecting"\n        all_sufficient = all_sufficient and status == "sufficient_basis"\n        result[key] = {"status": status, "sample_count": samples, "mae_kwh": metrics["mae_kwh"], "bias_kwh": metrics["bias_kwh"], "evaluation_coverage_percent": coverage, "accuracy_percent": metrics["accuracy_percent"], "valid_actual_quarters": denominator}\n    return {"profile": profile, "status": "sufficient_basis" if all_sufficient else "collecting", "minimum_samples_for_sufficient_basis": DAY_TYPE_DAYPART_MINIMUM_SAMPLES, "observer_only": True, "combinations": result}\n'''
              p.write_text(t)
          p=Path('custom_components/dummy_os_data/sensor.py'); t=p.read_text()
          t=t.replace('from .evaluation import calculate_day_type_quality, calculate_daypart_quality','from .evaluation import calculate_day_type_daypart_quality, calculate_day_type_quality, calculate_daypart_quality')
          t=t.replace('            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n','            DummyOSHomeForecastQualityByDayTypeSensor(coordinator),\n            DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator),\n')
          marker='\n\nclass DummyOSWeatherCurrentSensor(DummyOSWeatherBaseSensor):'
          cls='''\n\nclass DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(DummyOSBaseSensor):\n    """Observer-only Energy forecast quality by day type and daypart."""\n    _attr_name = "DO Energy Forecast Quality By Day Type And Daypart"\n    _attr_unique_id = "do_energy_forecast_quality_by_day_type_and_daypart"\n    _attr_suggested_object_id = "do_energy_forecast_quality_by_day_type_and_daypart"\n    _attr_icon = "mdi:calendar-clock"\n    @property\n    def _quality(self) -> dict[str, Any]:\n        return calculate_day_type_daypart_quality(self.coordinator.evaluations, self.coordinator.records, self.coordinator.profile, dt_util.as_local)\n    @property\n    def native_value(self) -> str: return str(self._quality["status"])\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        q=self._quality; return {"profile":q["profile"],"observer_only":True,"resolution_minutes":15,"minimum_samples_for_sufficient_basis":q["minimum_samples_for_sufficient_basis"],"combination_basis":"local_quarter_start_day_type_and_daypart","combinations":q["combinations"]}\n'''
          if 'class DummyOSHomeForecastQualityByDayTypeAndDaypartSensor' not in t: t=t.replace(marker,cls+marker)
          p.write_text(t)
          p=Path('custom_components/dummy_os_data/entity_migrations.py'); t=p.read_text(); t=t.replace('    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n}','    "do_energy_forecast_quality_by_day_type": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type",\n    "do_energy_forecast_quality_by_day_type_and_daypart": "sensor.dummy_os_forecast_do_energy_forecast_quality_by_day_type_and_daypart",\n}'); p.write_text(t)
          p=Path('custom_components/dummy_os_data/__init__.py'); t=p.read_text(); t=t.replace('    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n','    ("sensor", "do_energy_forecast_quality_by_day_type", "sensor.do_energy_forecast_quality_by_day_type"),\n    ("sensor", "do_energy_forecast_quality_by_day_type_and_daypart", "sensor.do_energy_forecast_quality_by_day_type_and_daypart"),\n'); p.write_text(t)
          p=Path('tests/test_release_consistency.py'); t=p.read_text(); t=t.replace('    "do_energy_forecast_quality_by_day_type",\n)','    "do_energy_forecast_quality_by_day_type",\n    "do_energy_forecast_quality_by_day_type_and_daypart",\n)').replace('self.assertEqual(16, sum(','self.assertEqual(17, sum('); p.write_text(t)
          PY
      - name: Write corrected tests
        run: |
          cat > tests/test_energy_day_type_daypart_quality.py <<'PY'
          from __future__ import annotations
          import importlib.util
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          ROOT=Path(__file__).resolve().parents[1]
          SPEC=importlib.util.spec_from_file_location('energy_evaluation_step5',ROOT/'custom_components/dummy_os_data/evaluation.py'); assert SPEC and SPEC.loader
          MODULE=importlib.util.module_from_spec(SPEC); SPEC.loader.exec_module(MODULE); calculate_quality=MODULE.calculate_day_type_daypart_quality
          LOCAL=ZoneInfo('Europe/Amsterdam')
          def iso(s): return datetime.fromisoformat(s).replace(tzinfo=LOCAL).astimezone(timezone.utc).isoformat()
          def ev(s,a=.1,f=.1,p='normal'): return {'start':iso(s),'profile':p,'actual_kwh':a,'forecast_kwh':f}
          def rec(s,p='normal',v=True): return {'start':iso(s),'profile':p,'valid':v}
          def loc(v): return v.astimezone(LOCAL)
          def test_exact_eight_combination_keys_and_boundaries():
              ts=['2026-09-04T05:45','2026-09-04T06:00','2026-09-04T12:00','2026-09-04T18:00','2026-09-05T05:45','2026-09-05T06:00','2026-09-05T12:00','2026-09-05T18:00']
              r=calculate_quality([ev(x) for x in ts],[rec(x) for x in ts],'normal',loc)
              assert set(r['combinations'])=={'weekday_night','weekday_morning','weekday_afternoon','weekday_evening','weekend_night','weekend_morning','weekend_afternoon','weekend_evening'}
              assert all(x['sample_count']==1 for x in r['combinations'].values())
          def test_profile_separation_and_missing_not_zero():
              e=[ev('2026-09-07T12:00',.1,.2),ev('2026-09-07T12:15',.5,.5,'away'),{'start':iso('2026-09-07T12:30'),'profile':'normal','actual_kwh':None,'forecast_kwh':.2}]
              x=calculate_quality(e,[rec('2026-09-07T12:00'),rec('2026-09-07T12:30')],'normal',loc)['combinations']['weekday_afternoon']
              assert x['sample_count']==1 and x['valid_actual_quarters']==2 and x['evaluation_coverage_percent']==50.0 and x['mae_kwh']==.1 and x['bias_kwh']==.1
          def test_total_readiness_requires_all_eight_segments():
              e=[]; rr=[]
              groups=[('2026-09-07','2026-09-08'),('2026-09-05','2026-09-06')]
              for dates in groups:
                  for hour in (0,6,12,18):
                      for date in dates:
                          for index in range(16):
                              s=f'{date}T{hour + index//4:02d}:{(index%4)*15:02d}'
                              e.append(ev(s)); rr.append(rec(s))
              r=calculate_quality(e,rr,'normal',loc)
              assert r['status']=='sufficient_basis'
              assert all(x['sample_count']==32 and x['status']=='sufficient_basis' for x in r['combinations'].values())
          def test_week_boundary_and_dst_use_local_calendar():
              ts=['2026-09-04T23:45','2026-09-05T00:00','2026-09-06T23:45','2026-09-07T00:00']; r=calculate_quality([ev(x) for x in ts],[rec(x) for x in ts],'normal',loc)
              assert r['combinations']['weekday_evening']['sample_count']==1 and r['combinations']['weekend_night']['sample_count']==1 and r['combinations']['weekend_evening']['sample_count']==1 and r['combinations']['weekday_night']['sample_count']==1
              d=calculate_quality([ev('2026-03-29T03:00')],[rec('2026-03-29T03:00')],'normal',loc); assert d['combinations']['weekend_night']['sample_count']==1
          PY
          cat > tests/test_energy_day_type_daypart_sensor_contract.py <<'PY'
          from pathlib import Path
          ROOT=Path(__file__).parents[1]
          def test_exact_identity_and_observer_contract():
              s=(ROOT/'custom_components/dummy_os_data/sensor.py').read_text(); i=(ROOT/'custom_components/dummy_os_data/__init__.py').read_text(); m=(ROOT/'custom_components/dummy_os_data/entity_migrations.py').read_text(); u='do_energy_forecast_quality_by_day_type_and_daypart'
              assert f'_attr_unique_id = "{u}"' in s and f'_attr_suggested_object_id = "{u}"' in s and 'DummyOSHomeForecastQualityByDayTypeAndDaypartSensor(coordinator)' in s and f'("sensor", "{u}", "sensor.{u}")' in i and f'"{u}": "sensor.dummy_os_forecast_{u}"' in m
          def test_native_architecture_remains_15_72_288():
              c=(ROOT/'custom_components/dummy_os_data/const.py').read_text(); assert 'QUARTER_MINUTES = 15' in c and 'FORECAST_HORIZON_HOURS = 72' in c and 'FORECAST_SLOTS = FORECAST_HORIZON_HOURS * 60 // QUARTER_MINUTES' in c
          PY
      - run: python -m pytest -q tests/test_energy_day_type_daypart_quality.py tests/test_energy_day_type_daypart_sensor_contract.py tests/test_energy_day_type_quality.py tests/test_energy_day_type_sensor_contract.py tests/test_energy_daypart_quality.py tests/test_energy_daypart_sensor_contract.py tests/test_energy_store_schema.py tests/test_energy_forward_evaluation_contract.py tests/test_release_consistency.py
      - name: Cleanup and commit
        run: |
          rm -f .github/workflows/apply-energy-step5.yml .github/workflows/apply-energy-step5-v2.yml
          find custom_components tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Energy Step 5 combined quality diagnostics'
          git push origin HEAD:energy-step5-day-type-daypart-quality
